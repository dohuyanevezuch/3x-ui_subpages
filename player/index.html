<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231ed760'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23000'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b0e;--sb:#000;--pn:#15151a;--pn2:#1d1d24;--hv:#26262f;--ink:#f4f4f6;--mu:#a2a2b0;--fa:#5b5b6a;--ac:#1ed760;--on-ac:#04140a;--ln:rgba(255,255,255,.08);--ok:#1ed760;--warn:#ffb020;--bad:#ff5d6c;--hue:150;
--f:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html[data-theme="light"]{--bg:#f4f4f7;--sb:#e9e9ef;--pn:#fff;--pn2:#f0f0f5;--hv:#e6e6ee;--ink:#14141a;--mu:#5f5f70;--fa:#a9a9b8;--ac:#12b24a;--on-ac:#fff;--ln:rgba(0,0,0,.09);--ok:#12924a;--warn:#b86e00;--bad:#d4313f;color-scheme:light}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f);color:var(--ink);background:var(--sb);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}
::selection{background:var(--ac);color:var(--on-ac)}.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);gap:8px;padding:8px 8px 96px;min-height:100vh}
.side{background:var(--bg);border-radius:12px;padding:16px 10px;position:sticky;top:8px;height:calc(100vh - 112px);overflow:auto;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:none}
.logo i svg{width:15px;height:15px;fill:var(--on-ac);margin-left:2px}
.logo b{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.logo small{display:block;font:500 11px var(--mono);color:var(--mu)}
.lib{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;color:var(--mu);font-weight:700;font-size:13px}
.lib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl{display:flex;align-items:center;gap:11px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;transition:.15s;min-width:0}
.pl:hover{background:var(--hv)}.pl.on{background:var(--pn2)}
.cov{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 50) 70% 30%));position:relative;overflow:hidden}
.cov .flag,.cov .flag-e{width:30px;height:21px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:17px;display:grid;place-items:center}
.cov.all svg{width:22px;height:22px;fill:#fff}
.pl span.t{min-width:0;flex:1}.pl b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.on b{color:var(--ac)}
.main{background:var(--bg);border-radius:12px;min-width:0;overflow:hidden;position:relative}
.main::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,hsl(var(--hue) 55% 30% / .85),transparent);pointer-events:none;transition:.6s}
html[data-theme="light"] .main::before{background:linear-gradient(180deg,hsl(var(--hue) 70% 70% / .6),transparent)}
.in{position:relative;padding:0 24px 30px}
.bar{display:flex;align-items:center;gap:10px;padding:18px 0 22px}
.bar .sp{flex:1}
.rb{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;transition:.2s;flex:none}
html[data-theme="light"] .rb{background:rgba(255,255,255,.7);color:var(--ink)}
.rb:hover{transform:scale(1.08)}.rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="dark"] .t-moon,html[data-theme="light"] .t-sun{display:none}
.announce{margin:0 0 16px;padding:11px 16px;border-radius:8px;background:var(--ac);color:var(--on-ac);font-weight:700}
.hero{display:flex;gap:24px;align-items:flex-end}
.bigcov{width:200px;height:200px;border-radius:8px;flex:none;display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.5);background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 50) 70% 28%))}
.bigcov svg{width:90px;height:90px;fill:rgba(255,255,255,.92)}
.bigcov .flag{width:110px;height:76px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.4)}.bigcov .flag-e{font-size:64px}
.hero .tx{min-width:0;flex:1}
.kick{font:800 12px var(--f);text-transform:uppercase;letter-spacing:.1em}
.hero h1{font:900 clamp(34px,6vw,76px)/1.02 var(--f);letter-spacing:-.04em;margin:6px 0 12px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;color:var(--mu)}
.meta b{color:var(--ink)}.meta .d{opacity:.5}
.ctl{display:flex;align-items:center;gap:14px;padding:22px 0 8px;flex-wrap:wrap}
.play{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;transition:.15s;flex:none}
.play:hover{transform:scale(1.06)}.play:active{transform:scale(.96)}
.play svg{width:24px;height:24px;fill:currentColor;margin-left:3px}
.play.ok svg{display:none}.play.ok::before{content:"✓";font-size:24px;font-weight:900;margin:0}
.pill{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--fa);font-weight:700;font-size:13.5px;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--ink);transform:scale(1.03)}
.fm{display:flex;gap:6px;flex-wrap:wrap}.fm button{height:32px;padding:0 13px;border-radius:99px;background:var(--pn2);font-weight:700;font-size:13px;color:var(--mu);transition:.15s}.fm button.on{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:20px}
.st{background:var(--pn);border-radius:10px;padding:14px 16px;min-width:0;transition:.2s}.st:hover{background:var(--pn2)}
.st small{display:block;font:700 11px var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.st b{display:block;font:800 22px/1.25 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st b.mono{font-size:19px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:32px 0 12px}
.sh h2{font:800 22px var(--f);letter-spacing:-.02em}.sh span{color:var(--mu);font-size:13px;font-weight:600}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.app-c{display:flex;align-items:center;gap:11px;padding:10px;background:var(--pn);border-radius:8px;transition:.2s;min-width:0}
.app-c:hover{background:var(--hv);transform:translateY(-2px)}
.app-c b{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;flex:none}
.ai svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;height:44px;border-radius:99px;background:var(--pn2);display:flex;align-items:center;gap:10px;padding:0 16px;border:2px solid transparent;transition:.2s}
.search:focus-within{border-color:var(--ink)}.search svg{width:18px;height:18px;stroke:var(--mu);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit}
.search kbd{font:700 11px var(--mono);color:var(--mu);border:1px solid var(--fa);border-radius:5px;padding:0 6px}.search:focus-within kbd{display:none}
.filters{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.crow{display:flex;align-items:center;gap:10px}.cl{font:800 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);width:84px;flex:none}
.cw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}.cw::-webkit-scrollbar{display:none}
.fchip{height:30px;padding:0 13px;border-radius:99px;background:var(--pn2);font:700 12.5px var(--f);color:var(--mu);display:inline-flex;align-items:center;gap:7px;transition:.15s;flex:none}
.fchip:hover{color:var(--ink)}.fchip.on{background:var(--ink);color:var(--bg)}.fchip.dim{opacity:.4}
.fchip i{width:8px;height:8px;border-radius:50%;display:block}.fchip em{font-style:normal;opacity:.6;font-size:11.5px}
.th{display:grid;grid-template-columns:36px minmax(0,1fr) 90px 110px;gap:12px;padding:6px 14px;border-bottom:1px solid var(--ln);color:var(--mu);font:700 11.5px var(--f);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.tr{border-radius:8px;transition:background .12s}.tr:hover{background:var(--pn2)}
.tm{display:grid;grid-template-columns:36px minmax(0,1fr) 90px 110px;gap:12px;align-items:center;padding:8px 14px}
.no{color:var(--mu);font:600 14px var(--mono);text-align:center;position:relative;height:20px;line-height:20px}
.no s{text-decoration:none;display:block}.no svg{display:none;width:15px;height:15px;fill:var(--ink);position:absolute;left:10px;top:3px}
.tr:hover .no s{display:none}.tr:hover .no svg{display:block}
.tt{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.tdot{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;flex:none;font:900 11px var(--f);letter-spacing:.04em;color:#fff;background:var(--pc)}
.tn{min-width:0;flex:1}.tn b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px;color:var(--mu);font-size:12.5px;align-items:center}
.tag{font:700 10.5px var(--f);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--hv);color:var(--mu)}
.tag.sec-reality{background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac)}.tag.sec-tls{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.tag.sec-none{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pt{font:600 14px var(--mono);color:var(--mu)}
.ab{display:flex;gap:2px;justify-content:flex-end}
.cbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mu);transition:.15s;flex:none}
.cbtn:hover{color:var(--ink);background:var(--hv);transform:scale(1.08)}
.cbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.ok{background:var(--ac);color:var(--on-ac)}.cbtn.ok svg{display:none}.cbtn.ok::before{content:"✓";font-weight:900}
.tr.open .cbtn.tg svg{transform:rotate(180deg)}.cbtn.tg svg{transition:transform .25s}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.3,.8,.2,1)}.tr.open .detail{grid-template-rows:1fr}
.detail .inn{overflow:hidden;min-height:0}.detail .pad{padding:2px 14px 14px 62px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}.kv div{min-width:0}
.kv span{display:block;font:700 10.5px var(--f);color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.kv b{display:block;font:600 12.5px var(--mono);word-break:break-all}
.rawl{margin-top:10px;font:500 11px/1.5 var(--mono);color:var(--mu);word-break:break-all;background:var(--pn);border-radius:8px;padding:8px 10px;max-height:4.6em;overflow:hidden}
.gh{padding:16px 14px 4px;display:flex;align-items:center;gap:10px;font:800 15px var(--f)}.gh .flag{width:24px;height:17px;border-radius:3px}.gh small{color:var(--mu);font-weight:600;font-size:12.5px}
.empty{padding:36px 16px;text-align:center;color:var(--mu);font-weight:650}
/* now playing */
.np{position:fixed;left:8px;right:8px;bottom:8px;z-index:50;display:grid;grid-template-columns:minmax(220px,1fr) minmax(300px,2fr) minmax(220px,1fr);gap:16px;align-items:center;background:var(--pn);border-radius:12px;padding:10px 16px;box-shadow:0 -8px 40px rgba(0,0,0,.35);border:1px solid var(--ln)}
.np .l{display:flex;align-items:center;gap:12px;min-width:0}.np .cov{width:54px;height:54px}
.np .l b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .l small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .c{min-width:0}
.seek{display:flex;align-items:center;gap:10px;font:500 11.5px var(--mono);color:var(--mu)}
.seek span{flex:none;min-width:48px;text-align:center}
.sk{flex:1;height:5px;border-radius:5px;background:var(--hv);position:relative;overflow:visible}
.sk i{display:block;height:100%;border-radius:5px;background:var(--ink);width:0;transition:width 1.6s cubic-bezier(.3,.8,.2,1);position:relative}
.sk i::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translateY(-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sk:hover i{background:var(--ac)}.sk.warn i{background:var(--warn)}.sk.bad i{background:var(--bad)}
.np .r{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.np .cl2{font:700 12px var(--f);color:var(--mu);margin-right:4px;text-align:right;white-space:nowrap}
.eqb{display:flex;gap:2px;align-items:flex-end;height:14px;margin-right:4px}.eqb i{width:3px;background:var(--ac);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eqb i:nth-child(2){animation-delay:.2s}.eqb i:nth-child(3){animation-delay:.4s}.eqb i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:80;padding:18px}.ov.on{display:grid;animation:fadei .2s both}@keyframes fadei{from{opacity:0}}
.modal{width:min(360px,100%);background:var(--pn);border-radius:14px;padding:22px;text-align:center;animation:pop .3s cubic-bezier(.2,1.2,.3,1) both}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.modal h3{font:800 17px var(--f);display:flex;gap:10px;align-items:center;justify-content:center}.pdot2{width:11px;height:11px;border-radius:50%;display:inline-block}
.modal p{font:500 11.5px/1.5 var(--mono);color:var(--mu);margin:8px 0 14px;word-break:break-all;max-height:3.4em;overflow:hidden}
.qrbox{background:#fff;border-radius:10px;padding:12px;display:inline-block}.qrbox canvas{display:block;width:240px;height:240px;max-width:100%;image-rendering:pixelated}
.row2{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{height:40px;padding:0 20px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;transition:.15s}.btn:hover{transform:scale(1.04)}
.btn.ac{background:var(--ac);color:var(--on-ac)}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--fa)}.btn.ok{background:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:104px;opacity:0;pointer-events:none;z-index:90;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;transition:.25s;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:84px}
  .side{position:static;height:auto;padding:12px 10px 8px;overflow:visible}
  .logo{padding-bottom:10px}.lib{display:none}
  #pls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}#pls::-webkit-scrollbar{display:none}
  .pl{width:auto;flex:none;padding:5px 12px 5px 5px;border-radius:99px;background:var(--pn2)}.pl .cov{width:32px;height:32px;border-radius:50%}.pl .cov .flag,.pl .cov .flag-e{width:22px;height:15px;font-size:12px}.pl small{display:none}.pl b{max-width:130px;font-size:13.5px}
  .np{grid-template-columns:minmax(0,1fr) auto}.np .c{grid-column:1/-1;grid-row:2}.np .r .cl2,.np .eqb{display:none}
}
@media (max-width:640px){
  .app{padding:0 0 84px;gap:0}.side,.main{border-radius:0}
  .in{padding:0 14px 24px}.bar{padding:12px 0 14px}
  .hero{flex-direction:column;align-items:flex-start;gap:14px}.bigcov{width:130px;height:130px}.bigcov svg{width:60px;height:60px}.bigcov .flag{width:76px;height:52px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.st b{font-size:19px}
  .ctl{gap:10px}.play{width:52px;height:52px}
  .search{flex-basis:100%;height:48px}.search kbd{display:none}.search input{font-size:16px}
  .crow{flex-direction:column;align-items:stretch;gap:5px}.cl{width:auto}.cw{flex-wrap:nowrap}
  .th{display:none}
  .tm{grid-template-columns:minmax(0,1fr) auto;gap:6px 6px;padding:8px 6px}
  .no,.pt{display:none}
  .tm .ab .cbtn.tg{display:none}.cbtn{width:40px;height:40px}
  .tn .tg .pt2{font-family:var(--mono)}
  .detail .pad{padding:2px 8px 12px}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toast{bottom:112px}
  .np{padding:8px 12px 10px;gap:6px 10px;bottom:0;left:0;right:0;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.np .cov{width:44px;height:44px}
  .seek span{min-width:40px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo"><i><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg></i><div style="min-width:0"><b id="title">Подписка</b><small id="subid"></small></div></div>
<div class="lib"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 6l6 14"/></svg>Плейлисты · узлы</div><div id="pls"></div></aside>
<main class="main"><div class="in">
 <div class="bar"><span class="sp"></span><a class="rb" id="support" href="#" target="_blank" rel="noopener noreferrer" hidden title="Поддержка" aria-label="Поддержка"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></a>
 <button class="rb" id="theme" aria-label="Сменить тему"><svg class="t-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="t-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button></div>
 <div id="announce"></div>
 <section id="hero"></section>
 <div class="sh"><h2>Открыть в приложении</h2><span>один тап — и всё настроено</span></div><div class="apps" id="apps"></div>
 <div class="sh"><h2 id="lh">Все треки</h2><span id="invsum"></span></div>
 <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Что будем слушать? Страна, узел, порт…" autocomplete="off"><kbd>/</kbd></label>

    d.nk.forEach(function(k){ h+='<button class="fchip'+(S.tf===k?' on':'')+(d.nc[k]?'':' dim')+'" data-tf="'+k+'">'+esc(k==='other'?'Другое':netLabel(k))+' <em>'+(d.nc[k]||0)+'</em></button>'; });
    h+='</div></div>';
  }
  return h;
}
function chipClick(e,after){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.pf!==undefined) S.pf=b.dataset.pf; if(b.dataset.tf!==undefined) S.tf=b.dataset.tf; after(); }
function svg(p){ return '<svg viewBox="0 0 24 24">'+p+'</svg>'; }
var IC={copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
var PLAYI='<svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>', ALLI='<svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8M19 8v9a2 2 0 11-2-2h2"/></svg>';
var PL=null;
function hueOf(s){ var h=0,i; s=String(s); for(i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%360; }
function hosts(){ var m={},o=[]; items.forEach(function(it){ if(!m[it.host]){ m[it.host]={host:it.host,cc:it.cc,n:0}; o.push(m[it.host]); } m[it.host].n++; }); return o; }
function nodeCount(){ return hosts().length; }
function curHue(){ return PL?hueOf(PL):hueOf(str(D.sId)||'x'); }
function renderPls(){
  var hs=hosts(), h='<button class="pl'+(PL===null?' on':'')+'" data-pl="" style="--h:'+hueOf(str(D.sId)||'x')+'"><span class="cov all">'+ALLI+'</span><span class="t"><b>Все треки</b><small>'+items.length+' · '+hs.length+' '+plural(hs.length,['узел','узла','узлов'])+'</small></span></button>';
  hs.forEach(function(x){ h+='<button class="pl'+(PL===x.host?' on':'')+'" data-pl="'+esc(x.host)+'" style="--h:'+hueOf(x.host)+'"><span class="cov">'+flagC(x.cc)+'</span><span class="t"><b>'+esc(ccName(x.cc)||x.host)+'</b><small>'+esc(x.host)+' · '+x.n+'</small></span></button>'; });
  $('pls').innerHTML=h; document.documentElement.style.setProperty('--hue',curHue());
}
function renderHero(){ renderTop(false); renderNP(); }
function renderTop(first){
  var r=calc(), em=uniqEmails(), who=em[0]||'—', id=str(D.sId).replace(/-/g,'').slice(0,8).toUpperCase()||'—';
  var cdw=r.expMs&&r.expMs>r.now?'<b class="mono cdv">'+cdShort(r.expMs-r.now)+'</b>':'<b>'+(r.expMs?'истёк':'∞')+'</b>';
  var h=curHue(), fmts=URLROWS.length>1?'<div class="fm" id="fmts">'+URLROWS.map(function(x,k){return '<button data-t="'+k+'" class="'+(k===SUBTAB?'on':'')+'">'+x[0]+'</button>';}).join('')+'</div>':'';
  $('hero').innerHTML=
   '<div class="hero" style="--h:'+h+'"><div class="bigcov">'+PLAYI+'</div><div class="tx"><div class="kick">Подписка · '+esc(r.label)+'</div><h1>'+esc(str(D.subTitle)||who)+'</h1>'+
   '<div class="meta"><b>'+esc(who)+'</b><span class="d">•</span><span>'+items.length+' '+plural(items.length,['трек','трека','треков'])+'</span><span class="d">•</span><span>'+nodeCount()+' '+plural(nodeCount(),['плейлист','плейлиста','плейлистов'])+'</span><span class="d">•</span><span>до '+esc(r.expTxt)+'</span></div></div></div>'+
   '<div class="ctl"><button class="play" id="ucopy" title="Скопировать подписку" aria-label="Скопировать подписку">'+PLAYI+'</button>'+fmts+'<button class="pill" id="uqr">Показать QR</button></div>'+
   '<div class="stats"><div class="st"><small>Использовано</small><b>'+esc(r.usedTxt)+'</b></div><div class="st"><small>Лимит</small><b>'+esc(r.tot>0?r.tTxt:'без лимита')+'</b></div><div class="st"><small>↓ / ↑</small><b>'+esc(r.dTxt)+' / '+esc(r.uTxt)+'</b></div><div class="st"><small>Последний вход</small><b class="lov" style="font-size:18px">'+esc(r.lastTxt)+'</b></div></div>';
  var f=$('fmts'); if(f) f.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; SUBTAB=+b.dataset.t; [].forEach.call(f.children,function(x,k){x.classList.toggle('on',k===SUBTAB);}); };
  $('ucopy').onclick=function(){ if(URLROWS.length) copy(URLROWS[SUBTAB][2],this); else toast('Адрес подписки недоступен'); };
  $('uqr').onclick=function(){ if(URLROWS.length) openQR(URLROWS[SUBTAB][2],'QR · '+URLROWS[SUBTAB][0],'#1ed760'); };
  tickAll();
}
var npFirst=true;
function renderNP(){
  var r=calc(), pct=r.tot>0?Math.min(100,r.pct):100, cls=r.tot>0?(r.pct>=90?'bad':r.pct>=70?'warn':''):'';
  var cur=PL?ccName((hosts().filter(function(x){return x.host===PL;})[0]||{}).cc)||PL:'Все узлы';
  var left=r.expMs&&r.expMs>r.now?'-'+cdShort(r.expMs-r.now):(r.expMs?'истёк':'∞');
  var w=npFirst?0:pct.toFixed(1);
  $('np').style.setProperty('--h',curHue());
  $('np').innerHTML='<div class="l"><div class="cov" style="--h:'+curHue()+'">'+(PL?flagC((hosts().filter(function(x){return x.host===PL;})[0]||{}).cc):'<span class="cov all">'+PLAYI+'</span>')+'</div><div style="min-width:0"><b>'+esc(str(D.subTitle)||'Подписка')+'</b><small>'+esc(cur)+' · '+esc(r.label)+'</small></div></div>'+
   '<div class="c"><div class="seek"><span>'+esc(r.usedTxt)+'</span><div class="sk '+cls+'"><i id="skf" style="width:'+w+'%"></i></div><span class="cdv">'+esc(left)+'</span></div></div>'+
   '<div class="r"><div class="eqb"><i></i><i></i><i></i><i></i></div><span class="cl2">'+(r.tot>0?Math.round(r.pct)+'% из '+esc(r.tTxt):'без лимита')+'</span><button class="cbtn" id="npc" title="Копировать подписку" aria-label="Копировать подписку">'+svg(IC.copy)+'</button><button class="cbtn" id="npq" title="QR" aria-label="QR">'+svg(IC.qr)+'</button></div>';
  $('npc').onclick=function(){ if(URLROWS.length) copy(URLROWS[SUBTAB][2],this); };
  $('npq').onclick=function(){ if(URLROWS.length) openQR(URLROWS[SUBTAB][2],'QR · '+URLROWS[SUBTAB][0],'#1ed760'); };
  if(npFirst){ npFirst=false; setTimeout(function(){ var f=$('skf'); if(f) f.style.width=pct.toFixed(1)+'%'; },500); }
}
function renderApps(){
  $('apps').innerHTML=APPS.map(function(a){ return '<a class="app-c" href="'+esc(a[2])+'">'+appIcon(a[1])+'<b>'+a[0]+'</b></a>'; }).join('')||'<div class="empty">Адрес подписки недоступен</div>';
}
function trackHtml(it,n,showCC){
  var tags=['<span class="tag">'+esc(it.proto)+'</span>','<span class="tag sec-'+esc(it.sec)+'">'+esc(secLabel(it.sec))+'</span>'];
  if(it.net) tags.push('<span class="tag">'+esc(netLabel(it.net))+'</span>');
  if(showCC&&it.cc) tags.push('<span>'+esc(ccName(it.cc))+'</span>');
  if(it.port) tags.push('<span class="pt2 mono" style="font-size:12px">:'+esc(it.port)+'</span>');
  return '<div class="tr'+(S.open[it.idx]?' open':'')+'" style="--pc:'+it.pc+'"><div class="tm"><div class="no"><s>'+n+'</s>'+PLAYI+'</div>'+
   '<div class="tt" data-tog="'+it.idx+'"><div class="tdot">'+esc(it.proto.slice(0,2).toUpperCase())+'</div><div class="tn"><b title="'+esc(it.remark||it.name)+'">'+esc(it.name)+'</b><div class="tg">'+tags.join('')+'</div></div></div>'+
   '<div class="pt">'+(it.port?':'+esc(it.port):'')+'</div>'+
   '<div class="ab"><button class="cbtn" data-c="'+it.idx+'" title="Скопировать ссылку" aria-label="Скопировать ссылку">'+svg(IC.copy)+'</button><button class="cbtn" data-q="'+it.idx+'" title="QR" aria-label="QR">'+svg(IC.qr)+'</button><button class="cbtn tg" data-tog="'+it.idx+'" title="Подробнее" aria-label="Подробнее">'+svg(IC.chev)+'</button></div></div>'+
   '<div class="detail"><div class="inn"><div class="pad"><div class="kv">'+detailKV(it).map(function(x){return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';}).join('')+'</div><div class="rawl">'+esc(it.raw)+'</div></div></div></div></div>';
}
function plVisible(){ var l=visible(); return PL===null?l:l.filter(function(x){return x.host===PL;}); }
function renderChips(){ $('chips').innerHTML=chipsHtml(); $('chips').style.display=$('chips').innerHTML?'':'none'; }
function renderGroups(){
  var list=plVisible();
  $('lh').textContent=PL===null?'Все треки':(ccName((hosts().filter(function(x){return x.host===PL;})[0]||{}).cc)||PL);
  $('invsum').textContent=list.length+' из '+items.length;
  if(!list.length){ $('groups').innerHTML='<div class="empty">'+(items.length?'Ничего не найдено':'В подписке пока нет подключений')+'</div>'; return; }
  var n=0;
  if(PL!==null){ $('groups').innerHTML=list.map(function(it){return trackHtml(it,++n,false);}).join(''); return; }
  var gs=groups(list);
  $('groups').innerHTML=gs.map(function(g){ var hd=S.g==='list'?'':'<div class="gh">'+(S.g==='proto'?'<span class="tdot" style="width:14px;height:14px;border-radius:50%;background:'+P[g.pk][1]+'"></span>'+esc(P[g.pk][0]):flagC(g.cc)+esc(ccName(g.cc))+'<small>'+esc(g.host||'')+'</small>')+'</div>'; return hd+g.items.map(function(it){return trackHtml(it,++n,S.g==='proto'||S.g==='list');}).join(''); }).join('');
}
function bindGroups(){
  S.g='node';
  $('groups').onclick=function(e){
    var b=e.target.closest('button');
    if(b&&b.dataset.c!==undefined){ copy(items[b.dataset.c].raw,b); return; }
    if(b&&b.dataset.q!==undefined){ var it=items[b.dataset.q]; openQR(it.raw,it.proto+' · '+it.name,it.pc); return; }
    var t=e.target.closest('[data-tog]'); if(t){ var i=t.dataset.tog; S.open[i]=!S.open[i]; t.closest('.tr').classList.toggle('open'); }
  };
  $('pls').onclick=function(e){ var b=e.target.closest('.pl'); if(!b) return; PL=b.dataset.pl||null; renderPls(); renderNP(); renderTop(false); renderGroups(); if(window.innerWidth<=980){ var s=$('lh'); s.scrollIntoView({behavior:'smooth',block:'start'}); } };
  $('chips').onclick=function(e){ chipClick(e,function(){ renderChips(); renderGroups(); }); };
  $('q').oninput=function(){ S.q=this.value; renderGroups(); };
  $('copyall').onclick=function(){ copyAllOf(plVisible(),this); };
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeQR(); return; }
  var tg=(e.target.tagName||'').toLowerCase();
  if(e.key==='/'&&tg!=='input'&&tg!=='textarea'){ e.preventDefault(); $('q').focus(); }
});

headCommon(); loadItems(); buildSub(); bindQR(); bindGroups();
renderPls(); renderTop(true); renderNP(); renderApps(); renderChips(); renderGroups();

/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
</script>
