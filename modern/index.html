<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d2ff3d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b0c; --s1:#141416; --s2:#1c1c1f; --ln:#2a2a2f; --tx:#f3f2ee; --mu:#8f8f98; --fa:#5c5c65;
  --lime:#d2ff3d; --on-lime:#0b0b0c; --warn:#ff9f43; --bad:#ff5468;
  --head:"SF Pro Display","Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#ece9e1; --s1:#f8f6f0; --s2:#e3dfd3; --ln:#d0cbbc; --tx:#131311; --mu:#6a675c; --fa:#a29e8f;
  --lime:#c9f53a; --on-lime:#0f0f0d; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:15px/1.5 var(--head);color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--ln) 1.1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.shell{max-width:1180px;margin:0 auto;padding:16px 20px 80px}
::selection{background:var(--lime);color:var(--on-lime)}

/* ---------- top bar */
.bar{display:flex;align-items:center;gap:14px;padding:6px 0 16px}
.mark{display:flex;align-items:center;gap:11px;font:800 14px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;min-width:0}
.mark b{width:14px;height:14px;border-radius:50%;background:var(--lime);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 55%,transparent);animation:beat 2.4s infinite}
.mark span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes beat{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bar small{font:500 12px var(--mono);color:var(--fa);white-space:nowrap}
.bar-r{margin-left:auto;display:flex;gap:8px}
.pill{height:40px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);display:inline-flex;align-items:center;gap:8px;padding:0 15px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:.2s}
.pill:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pill.sq{width:40px;padding:0;justify-content:center}
.pill svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="dark"] .i-moon,html[data-theme="light"] .i-sun{display:none}

.announce{display:flex;gap:12px;align-items:center;margin:4px 0 14px;padding:14px 18px;border-radius:18px;background:var(--warn);color:#150d00;font-weight:650;font-size:14px}
.announce svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ticker */
.ticker{overflow:hidden;border-block:1px solid var(--ln);margin:0 -20px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tk{display:flex;width:max-content;animation:mq 50s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
.tk span{display:inline-flex;align-items:center;gap:11px;padding:12px 0 12px 30px;font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.tk span::after{content:"✦";color:var(--tx);margin-left:30px;opacity:.5}
.tk .flag{width:24px;height:16px;border-radius:3px}
.tk .flag-e{width:24px;height:16px;font-size:14px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- headline + bento */
.hl{font:800 clamp(40px,7vw,84px)/.96 var(--head);letter-spacing:-.05em;margin:38px 0 28px}
.hl em{font-style:normal;background:var(--lime);color:var(--on-lime);padding:0 .14em;border-radius:.16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:30px;padding:26px;position:relative;overflow:hidden;animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.t-traffic{grid-column:span 7}
.t-time{grid-column:span 5;background:var(--lime);color:var(--on-lime);border-color:transparent;display:flex;flex-direction:column;animation-delay:.1s}
.t-time.bad{background:var(--bad);color:#fff}
.t-time.bad .cd div{background:#fff;color:var(--bad)}
.t-time.warn{background:var(--warn);color:#150d00}
.t-time.warn .cd div{background:#150d00;color:var(--warn)}
.lab{font:700 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.t-time .lab{color:inherit;opacity:.62}
.big{font:800 clamp(66px,10.5vw,138px)/.86 var(--head);letter-spacing:-.065em;margin:16px 0 8px;font-variant-numeric:tabular-nums}
.big small{font-size:.26em;letter-spacing:-.02em;margin-left:.18em;color:var(--mu);font-weight:700}
.of{font:600 14px var(--mono);color:var(--mu)}
.of b{color:var(--tx)}
.ticks{display:grid;grid-template-columns:repeat(48,1fr);gap:3px;height:36px;margin:20px 0 12px}
.ticks i{border-radius:3px;background:var(--s2);display:block;transform-origin:bottom}
.ticks i.d{background:var(--lime)}
.ticks i.u{background:var(--tx)}
.ticks.warn i.d{background:var(--warn)}
.ticks.bad i.d{background:var(--bad)}
.ticks i.f{animation:grow .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i)*16ms + .25s)}
@keyframes grow{from{transform:scaleY(.12);opacity:0}}
.ticks.inf i{animation:wave 3s ease-in-out infinite;animation-delay:calc(var(--i)*45ms)}
@keyframes wave{40%,60%{background:var(--lime);transform:scaleY(1.0)}0%,100%{transform:scaleY(.55)}}
.lg{display:flex;gap:18px;flex-wrap:wrap;font:600 12px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.lg span{display:inline-flex;gap:7px;align-items:center}
.lg i{width:10px;height:10px;border-radius:3px;display:block}
.cells{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln);margin:22px -26px -26px}
.cell{padding:16px 26px;border-right:1px solid var(--ln);min-width:0}
.cell:last-child{border:0}
.cell b{font:700 clamp(17px,2.2vw,24px) var(--mono);display:block;margin-top:5px;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.st{font:800 clamp(26px,3.4vw,38px)/1 var(--head);letter-spacing:-.04em;display:flex;align-items:center;gap:12px;margin-top:16px;text-transform:uppercase}
.live{width:14px;height:14px;border-radius:50%;background:currentColor;flex:none;animation:beat2 2s infinite}
@keyframes beat2{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.until{font:700 13px var(--mono);margin-top:8px;opacity:.72;letter-spacing:.04em;text-transform:uppercase}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:26px}
.cd div{background:var(--on-lime);color:var(--lime);border-radius:18px;padding:14px 4px 10px;text-align:center;min-width:0}
.cd b{display:block;font:800 clamp(28px,4.2vw,46px)/1 var(--mono);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.cd small{display:block;font:700 10px var(--mono);letter-spacing:.16em;opacity:.65;margin-top:5px}
.cd b.flip{animation:flip .38s cubic-bezier(.3,1.4,.4,1)}
@keyframes flip{from{transform:translateY(-40%) scale(.9);opacity:0}}
.inf-big{font:800 clamp(80px,11vw,140px)/.8 var(--head);margin-top:auto;padding-top:20px;letter-spacing:-.06em}
.olrow{display:flex;align-items:center;gap:10px;margin-top:18px;font:700 12.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.olrow .live{width:10px;height:10px;animation:none;opacity:.35}
.olrow.on .live{opacity:1;animation:beat2 2s infinite}
.chips-em{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips-em span{font:600 11.5px var(--mono);padding:3px 10px;border-radius:99px;border:1px solid currentColor;opacity:.7}

/* ---------- subscription tile */
.sub-tile{margin-top:12px;animation-delay:.2s}
.sub{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}
.tabs{display:flex;gap:2px;position:relative;border-bottom:1px solid var(--ln);margin:14px 0 18px;overflow-x:auto}
.tabs button{padding:11px 16px;font:700 12.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mu);white-space:nowrap;transition:color .2s}
.tabs button.on,.tabs button:hover{color:var(--tx)}
.tabs .ul{position:absolute;bottom:-1px;left:0;height:3px;width:0;background:var(--lime);border-radius:3px;transition:transform .35s cubic-bezier(.3,.8,.2,1),width .35s cubic-bezier(.3,.8,.2,1)}
.urlbox{font:600 15px/1.55 var(--mono);word-break:break-all;padding:18px 20px;border-radius:20px;background:var(--s2);border:1.5px dashed var(--fa);transition:border-color .3s,background .3s}
.urlbox.flash{animation:flashb .5s}
@keyframes flashb{from{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 18%,var(--s2))}}
.cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:44px;padding:0 20px;border-radius:99px;border:1.5px solid var(--ln);background:var(--s1);display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 12.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--tx);color:var(--bg);border-color:var(--tx);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.btn.lime{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.lime:hover{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.btn.sm{height:36px;padding:0 14px;font-size:11.5px}
.btn.ok svg{display:none}
.btn.ok::before{content:"✓";font-weight:900}
.qrw{background:#fff;border-radius:26px;padding:14px;width:190px;height:190px;transition:transform .4s cubic-bezier(.3,1.4,.4,1)}
.qrw:hover{transform:rotate(-3deg) scale(1.05)}
.qrw canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.apps{grid-column:1/-1;margin-top:26px;padding-top:22px;border-top:1px solid var(--ln)}
.apps .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin-top:12px}
.apps a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:18px;font-weight:700;font-size:14px;transition:.2s}
.apps a b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:800 12px var(--mono);color:#0b0b0c;flex:none}
.apps a:hover{background:var(--tx);color:var(--bg);border-color:var(--tx);transform:translateY(-3px)}

/* ---------- connections */
.conn{margin-top:64px}
.conn-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.conn-h h2{font:800 clamp(34px,5.4vw,64px)/.95 var(--head);letter-spacing:-.05em}
.conn-h p{font:600 12.5px var(--mono);color:var(--mu);margin-top:10px;letter-spacing:.05em;text-transform:uppercase}
.conn-h .btns{display:flex;gap:8px}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:34px;align-items:start}
aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:24px}
.search{height:46px;border-radius:99px;border:1.5px solid var(--ln);background:var(--s1);display:flex;align-items:center;gap:9px;padding:0 16px;transition:.2s}
.search:focus-within{border-color:var(--lime);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 22%,transparent)}
.search svg{width:17px;height:17px;stroke:var(--mu);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px}
.search kbd{font:700 11px/1 var(--mono);color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:3px 6px}
.search:focus-within kbd{display:none}
.al{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa);margin:0 0 10px 4px}
.rad{display:flex;flex-direction:column;gap:2px}
.rad button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-align:left;font-weight:650;color:var(--mu);transition:.2s}
.rad button::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--fa);transition:.2s;flex:none}
.rad button:hover{color:var(--tx);background:var(--s1)}
.rad button.on{color:var(--tx);background:var(--s1)}
.rad button.on::before{background:var(--lime);border-color:var(--lime);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 25%,transparent)}
.crow{margin-bottom:20px}
.crow:last-child{margin-bottom:0}
.cl{display:block;font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa);margin:0 0 10px 4px}
.cw{display:flex;flex-wrap:wrap;gap:6px}
.fchip{height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--ln);font:700 12px var(--mono);letter-spacing:.03em;color:var(--mu);display:inline-flex;align-items:center;gap:7px;transition:.2s}
.fchip:hover{color:var(--tx);border-color:var(--mu)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fchip.dim{opacity:.35}
.fchip i{width:9px;height:9px;border-radius:3px;display:block}
.fchip em{font-style:normal;opacity:.6}

.grp{margin-bottom:30px}
.grp.an{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.gh{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;padding:13px 4px 12px;cursor:pointer;user-select:none;
  background:color-mix(in srgb,var(--bg) 96%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--tx)}
.gh:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.gh .flag{width:44px;height:30px;border-radius:7px;transition:transform .35s cubic-bezier(.3,1.5,.4,1)}
.gh .flag-e{width:44px;height:30px;font-size:26px}
.gh:hover .flag,.gh:hover .flag-e{transform:rotate(-5deg) scale(1.1)}
.gt{min-width:0}
.gt b{display:block;font:800 clamp(18px,2.4vw,24px)/1.05 var(--head);letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{display:block;font:500 12.5px var(--mono);color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr{margin-left:auto;display:flex;align-items:center;gap:12px}
.pdots{display:flex;gap:4px}
.pdots i{width:9px;height:9px;border-radius:3px;display:block}
.cnt{font:800 13px var(--mono);min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--tx);color:var(--bg);display:grid;place-items:center}
.chev{width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.grp.closed .chev{transform:rotate(-90deg)}
.rowsw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.3,.8,.2,1)}
.rowsw>.rows{overflow:hidden;min-height:0}
.grp.closed .rowsw{grid-template-rows:0fr}
.row{border-bottom:1px solid var(--ln)}
.rm{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 8px;position:relative;transition:background .18s,padding .22s}
.rm:hover{background:var(--s1);padding-left:18px}
.rm::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--pc);transform:scaleY(0);transition:transform .22s}
.rm:hover::before,.row.open .rm::before{transform:scaleY(1)}
.pk{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font:800 14px var(--mono);letter-spacing:-.02em;background:var(--pc);color:#0b0b0c;transition:transform .3s cubic-bezier(.3,1.5,.4,1)}
.rm:hover .pk{transform:rotate(-6deg) scale(1.08)}
.nm{min-width:0;cursor:pointer}
.nm b{display:block;font:700 16.5px/1.25 var(--head);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font:700 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.tag.sec-reality{background:color-mix(in srgb,var(--lime) 20%,transparent);border-color:color-mix(in srgb,var(--lime) 70%,transparent);color:var(--tx)}
.tag.sec-tls{border-color:var(--tx);color:var(--tx)}
.tag.sec-none{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.port{font:800 19px var(--mono);letter-spacing:-.05em;text-align:right;white-space:nowrap}
.port span{color:var(--fa);font-weight:600}
.ab{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;transition:.2s}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.ib:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ib.ok{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.ib.ok svg{display:none}
.ib.ok::before{content:"✓";font-weight:900}
.row.open .ib.tg svg{transform:rotate(180deg)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s cubic-bezier(.3,.8,.2,1)}
.row.open .detail{grid-template-rows:1fr}
.detail .in{overflow:hidden;min-height:0}
.detail .pad{padding:4px 8px 18px 72px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.kv div{background:var(--s1);padding:11px 14px;min-width:0}
.kv span{display:block;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fa)}
.kv b{display:block;font:600 13.5px var(--mono);word-break:break-all;margin-top:3px}
.rawl{margin-top:10px;font:500 12px/1.5 var(--mono);color:var(--mu);word-break:break-all;padding:12px 14px;border-radius:16px;background:var(--s2);max-height:5.2em;overflow:hidden}
.empty{padding:60px 20px;text-align:center;color:var(--mu);font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px dashed var(--ln);border-radius:26px}
.foot{margin-top:60px;text-align:center;color:var(--fa);font:600 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* ---------- modal + toast */
.ov{position:fixed;inset:0;background:rgba(6,6,7,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:18px}
.ov.on{display:grid;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(400px,100%);background:var(--s1);border:1.5px solid var(--tx);border-radius:32px;padding:24px;text-align:center;animation:pop .35s cubic-bezier(.2,1.3,.3,1) both;box-shadow:12px 12px 0 var(--lime)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}}
.modal h3{font:800 20px var(--head);letter-spacing:-.03em;display:flex;align-items:center;gap:10px;justify-content:center}
.pdot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.modal p{font:500 11.5px/1.5 var(--mono);color:var(--mu);margin:8px 0 16px;word-break:break-all;max-height:3.4em;overflow:hidden}
.qrbox{background:#fff;border-radius:22px;padding:16px;display:inline-block}

function b64d(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  var bin=atob(s); try{ return decodeURIComponent(escape(bin)); }catch(e){ return bin; }
}
function dec(s){ try{ return decodeURIComponent(s); }catch(e){ return s; } }
function parse(raw,idx){
  raw=str(raw).trim();
  var o={raw:raw,idx:idx,pk:'other',host:'',port:'',remark:'',sec:'',net:'',p:{}};
  var m=raw.match(/^([a-z0-9+.\-]+):\/\/(?:([^@\/?#]*)@)?(\[[^\]]+\]|[^:\/?#]*)(?::(\d+))?([^?#]*)(?:\?([^#]*))?(?:#(.*))?$/i);
  if(!m){ o.remark=(raw.split(/\r?\n/)[0]||'Конфигурация').slice(0,60); o.host='—'; return o; }
  var sch=m[1].toLowerCase(), q=m[6]||'';
  q.split('&').forEach(function(kv){ if(!kv) return; var i=kv.indexOf('='); var k=i<0?kv:kv.slice(0,i); o.p[k]=dec(i<0?'':kv.slice(i+1).replace(/\+/g,' ')); });
  o.host=m[3].replace(/^\[|\]$/g,''); o.port=m[4]||''; o.remark=dec(m[7]||'');
  if(sch==='vmess'){
    o.pk='vmess';
    try{ var j=JSON.parse(b64d(raw.slice(8).split('#')[0])); o.host=str(j.add); o.port=str(j.port); o.remark=str(j.ps)||o.remark;
      o.net=str(j.net); o.sec=(j.tls&&j.tls!=='none')?'tls':'none'; o.p.sni=str(j.sni||j.host); o.p.path=str(j.path); }catch(e){}
  } else if(sch==='vless'){ o.pk='vless'; }
  else if(sch==='trojan'){ o.pk='trojan'; }
  else if(sch==='ss'){ o.pk='ss';
    if(!o.port){ try{ var d=b64d(m[3]+(m[2]?'':'')); var mm=d.match(/@(.+):(\d+)$/); if(mm){o.host=mm[1];o.port=mm[2];} }catch(e){} } }
  else if(sch==='hysteria2'||sch==='hy2'){ o.pk='hysteria2'; o.net='udp'; }
  else if(sch==='hysteria'){ o.pk='hysteria'; o.net='udp'; }
  else if(sch==='tuic'){ o.pk='tuic'; o.net='udp'; }
  else if(sch==='wireguard'||sch==='wg'){ o.pk='wg'; o.net='udp'; }
  else if(sch==='awg'||sch==='amneziawg'){ o.pk='awg'; o.net='udp'; }
  else if(sch==='tg'||(sch==='https'&&/t\.me$/.test(m[3])&&/^\/proxy/.test(m[5]))){
    o.pk='mtproto'; o.host=str(o.p.server)||o.host; o.port=str(o.p.port)||o.port; o.net='tcp'; o.sec='faketls'; }
  else { o.pk='other'; }
  if(!o.sec){ o.sec=str(o.p.security); if(!o.sec) o.sec=(o.pk==='trojan'||o.pk==='hysteria2'||o.pk==='hysteria'||o.pk==='tuic')?'tls':'none'; }
  if(!o.net) o.net=str(o.p.type)||(o.pk==='wg'||o.pk==='awg'?'udp':'tcp');
  if(/amnezia/i.test(o.remark)&&o.pk==='wg') o.pk='awg';
  o.proto=P[o.pk][0]; o.pc=P[o.pk][1];
  /* страна и «чистое» имя */
  var name=o.remark, cc=ccFromEmoji(name);
  name=name.replace(/^\s*[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]\s*/,'').trim();
  var low=name.toLowerCase(), i2;
  for(i2=0;i2<NAMES_SORTED.length;i2++){ var nm=NAMES_SORTED[i2]; if(low===nm||low.indexOf(nm+' ')===0||low.indexOf(nm+'-')===0){ if(!cc) cc=NAME2CC[nm]; name=name.slice(nm.length).replace(/^[\s\-–—|·:]+/,''); break; } }
  (D.emails||[]).forEach(function(em){ em=str(em); if(!em) return;
    if(name.slice(-em.length-1)==='-'+em) name=name.slice(0,-em.length-1);
    else if(name.slice(0,em.length+1)===em+'-') name=name.slice(em.length+1); });
  o.cc=cc; o.name=name.trim()||o.proto;
  return o;
}

  var hostCC={};
  items.forEach(function(it){ if(it.cc&&!hostCC[it.host]) hostCC[it.host]=it.cc; });
  items.forEach(function(it){ if(!it.cc) it.cc=hostCC[it.host]||''; });
}

function cmpItem(a,b){

function ccName(cc){ return cc&&C[cc]?C[cc][0]:'Без страны'; }
function groups(list){
  if(S.g==='list') return [{key:'all',items:list.slice()}];
  var map={},arr=[];
  list.forEach(function(it){
    var k=S.g==='node'?it.host:S.g==='country'?(it.cc||'?'):it.pk;
    if(!map[k]){ map[k]={key:k,items:[],cc:it.cc,host:it.host,pk:it.pk}; arr.push(map[k]); }
    map[k].items.push(it);
  });
  arr.forEach(function(g){ g.items.sort(cmpItem); });
  arr.sort(function(a,b){
    if(S.g==='proto') return P[a.pk][2]-P[b.pk][2];
    var an=a.cc?0:1,bn=b.cc?0:1; if(an!==bn) return an-bn;

$('mdl').onclick=function(){ var a=document.createElement('a'); a.download='qr.png'; a.href=$('qr').toDataURL('image/png'); document.body.appendChild(a); a.click(); document.body.removeChild(a); };

/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

/* --------------------------------------------------------------------------- старт */
function head(){
  var t=str(D.subTitle)||'Подписка'; $('title').textContent=t; document.title=t;
  var id=str(D.sId); $('subid').textContent=id?'ID '+(id.length>22?id.slice(0,8)+'…'+id.slice(-4):id):'';
  var su=str(D.subSupportUrl); if(su&&/^(https?:|tg:|mailto:)/i.test(su)){ var a=$('support'); a.href=su; a.hidden=false; }
  var an=str(D.announce).trim(); if(an) $('announce').innerHTML='<div class="announce">'+ic(I.warn)+'<div>'+esc(an).replace(/\n/g,'<br>')+'</div></div>';
}
head(); loadItems(); renderHero(true); renderTicker(); renderUrls(); renderChips(); renderGroups(true); bindGroups();
window.addEventListener('resize',function(){ if(URLROWS.length) selectTab(SUBTAB,false); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(URLROWS.length) selectTab(SUBTAB,false); });

/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
</script>
