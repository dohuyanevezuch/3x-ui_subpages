<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' fill='%23008080'/%3E%3Crect x='4' y='6' width='24' height='17' fill='%23c0c0c0' stroke='%23000'/%3E%3Crect x='7' y='9' width='18' height='11' fill='%23000080'/%3E%3Crect x='11' y='25' width='10' height='3' fill='%23c0c0c0' stroke='%23000'/%3E%3C/svg%3E">
<style>
:root{
  --face:#c0c0c0; --hi:#ffffff; --hi2:#dfdfdf; --sh:#808080; --dk:#404040; --bgd:#008080; --txt:#000; --field:#fff; --sel:#000080; --selt:#fff;
  --tbA:linear-gradient(90deg,#000080,#1084d0); --tbI:linear-gradient(90deg,#808080,#b5b5b5); --ok:#007a00; --bad:#c00000; --warn:#a05a00; --link:#0000ee;
  --f:Tahoma,"MS Sans Serif","Segoe UI",Verdana,Arial,sans-serif; --mono:"Lucida Console","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
html[data-theme="dark"]{
  --face:#2c2f35; --hi:#5d636d; --hi2:#444952; --sh:#16181c; --dk:#000; --bgd:#0d2b3b; --txt:#e6e9ee; --field:#101318; --sel:#2f6fd0; --selt:#fff;
  --tbA:linear-gradient(90deg,#3a1c71,#4a6fd0); --tbI:linear-gradient(90deg,#2a2d33,#3d424b); --ok:#5fe07a; --bad:#ff7a7a; --warn:#ffc45a; --link:#7aa8ff; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:13px/1.35 var(--f);color:var(--txt);background:var(--bgd);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:none;user-select:none}
html[data-theme="light"] body{background:var(--bgd)}
button,select,input{font:inherit;color:var(--txt)}
a{color:inherit;text-decoration:none}
::selection{background:var(--sel);color:var(--selt)}
.mono{font-family:var(--mono)}
svg.px{shape-rendering:crispEdges}

/* 98 primitives */
.raised{border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi2);background:var(--face)}
.sunk{border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi2);background:var(--field)}
.b98{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi2);padding:3px 14px;min-height:26px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--txt)}
.b98:active,.b98.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);padding:4px 13px 2px 15px}
.b98:focus-visible{outline:1px dotted var(--txt);outline-offset:-5px}
.b98.sm{min-height:22px;padding:1px 8px}
.grp{border:2px groove var(--hi);padding:12px 10px 8px;margin:6px 0 10px;position:relative}
.grp>legend{padding:0 4px;margin-left:4px}
fieldset{min-width:0}
.sep98{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:6px 0}

/* desktop */
.desk{position:relative;min-height:100vh;padding-bottom:44px}
.icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:14px;z-index:1}
.ico{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff;cursor:pointer;padding:2px}
.ico svg{width:40px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}
.ico span{font-size:12px;padding:1px 3px;text-shadow:1px 1px 0 #000;line-height:1.2}
.ico.on span{background:var(--sel);outline:1px dotted #fff;text-shadow:none}
.ico.on svg{filter:brightness(.6) sepia(1) hue-rotate(190deg) saturate(3)}

.win{position:absolute;display:flex;flex-direction:column;z-index:2;min-width:300px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi2),2px 2px 0 rgba(0,0,0,.45);padding:2px;animation:winin .25s steps(5) both}
@keyframes winin{from{opacity:0;transform:scale(.96)}}
.win.hide{display:none}
.win.max{position:fixed!important;left:0!important;top:0!important;right:0;bottom:36px;width:auto!important;height:auto!important;z-index:50!important}
.tbar{display:flex;align-items:center;gap:6px;background:var(--tbI);color:#c9c9c9;font-weight:700;padding:2px 3px 2px 4px;min-height:22px;cursor:move;touch-action:none}
.win.act .tbar{background:var(--tbA);color:#fff}
.tbar svg{width:16px;height:16px;flex:none}
.tbar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb{display:flex;gap:2px;flex:none}
.tbb button{width:18px;height:16px;padding:0;font:700 10px/1 var(--f);display:grid;place-items:center;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);color:var(--txt);cursor:pointer}
.tbb button:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh)}
.tbb button+button+button{margin-left:2px}
.mbar{display:flex;gap:14px;padding:2px 6px;border-bottom:1px solid var(--sh)}
.mbar span{cursor:default}
.mbar span:hover{background:var(--sel);color:var(--selt)}
.wb{padding:8px;overflow:auto;flex:1;min-height:0;user-select:text}
.win.min .wb,.win.min .sbar,.win.min .mbar{display:none}
.sbar{display:flex;gap:2px;padding:2px 2px 0}
.sbar span{flex:1;padding:1px 6px;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbar span:first-child{flex:2}

/* status window */
.sw{display:flex;gap:12px;align-items:flex-start}
.sw .big{width:48px;height:48px;flex:none}
.kv98{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;flex:1;min-width:0}
.kv98 span:nth-child(odd){color:var(--txt);opacity:.75}
.kv98 b{font-weight:700;word-break:break-word}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}
.prog98{height:22px;padding:2px;margin:6px 0 4px}
.prog98 i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sel) 0 9px,transparent 9px 12px);transition:width 1.2s steps(24)}
.prog98.warn i{background:repeating-linear-gradient(90deg,#c08000 0 9px,transparent 9px 12px)}
.prog98.bad i{background:repeating-linear-gradient(90deg,#c00000 0 9px,transparent 9px 12px)}
.cdv98{font:700 22px var(--mono);letter-spacing:1px}
.pcrow{display:flex;justify-content:space-between;gap:8px}

/* link window */
.tabs98{display:flex;gap:0;padding-left:4px;position:relative;z-index:1;margin-bottom:-2px}
.tabs98 button{padding:3px 12px 4px;border:2px solid;border-color:var(--hi) var(--dk) transparent var(--hi);background:var(--face);margin-top:2px;cursor:pointer;box-shadow:inset 1px 1px var(--hi2);margin-right:-1px}
.tabs98 button.on{margin-top:0;padding-top:5px;padding-bottom:6px;z-index:2;position:relative}
.tabpage{padding:10px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi2)}
.urlbox{padding:6px 8px;font:12px/1.45 var(--mono);word-break:break-all;min-height:56px;user-select:all;cursor:text}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qrbox98{padding:6px;background:#fff;width:150px;height:150px}
.qrbox98 canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.lnkrow{display:flex;gap:12px;align-items:flex-start}

/* explorer */
.tools98{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tools98 label{display:flex;align-items:center;gap:5px}
.tools98 select,.tools98 input[type=search]{padding:2px 4px;min-height:24px;background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);outline:0;border-radius:0;color:var(--txt)}
.tools98 input[type=search]{width:150px;user-select:text}
.exp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px;height:340px}
.tree{overflow:auto;padding:3px}
.tn{display:flex;align-items:center;gap:5px;padding:1px 4px;cursor:default;white-space:nowrap}
.tn.on{background:var(--sel);color:var(--selt);outline:1px dotted var(--selt);outline-offset:-1px}
.tn .flag{width:16px;height:11px;flex:none;box-shadow:0 0 0 1px #000}
.tn .flag-e{width:16px;height:11px;font-size:10px;display:grid;place-items:center}
.tn svg{width:16px;height:16px;flex:none}
.tn em{font-style:normal;opacity:.7;margin-left:auto}
.tn.root{font-weight:700}
.tn.lvl{padding-left:20px}
.right{display:flex;flex-direction:column;min-width:0;gap:6px}
.lv{flex:1;min-height:0;overflow:auto;position:relative}
.lt{width:100%;border-collapse:separate;border-spacing:0}
.lt th{position:sticky;top:0;z-index:2;text-align:left;font-weight:400;padding:2px 8px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);cursor:pointer;white-space:nowrap}
.lt th:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk)}
.lt td{padding:2px 8px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:default}
.lt tr.r.on td{background:var(--sel);color:var(--selt)}
.lt tr.r.on td{outline:1px dotted var(--selt);outline-offset:-1px}
.pdot98{display:inline-block;width:9px;height:9px;margin-right:6px;border:1px solid #000;vertical-align:-1px}
.props{padding:6px 8px;font:11.5px/1.5 var(--mono);min-height:84px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text}
.props b{font-weight:700;color:var(--sel)}
html[data-theme="dark"] .props b{color:#7aa8ff}
.apps98{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:6px}
.ap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;text-align:center;cursor:pointer;border:1px solid transparent}
.ap:hover{border:1px dotted var(--txt)}
.ap:active{background:var(--sel);color:var(--selt)}
.ap .ai{width:36px;height:36px;display:grid;place-items:center;border:2px solid;border-color:var(--hi) #000 #000 var(--hi)}
.ap .ai svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}
.announce{margin-bottom:8px;padding:6px 8px;border:2px solid #000;background:#ffffe1;color:#000}
.announce::before{content:"⚠ ";font-weight:700}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:36px;z-index:60;display:flex;align-items:center;gap:4px;padding:3px 3px;background:var(--face);border-top:2px solid var(--hi);box-shadow:0 -1px 0 var(--hi2)}
.start{font-weight:700;min-height:28px;padding:2px 10px;gap:6px}
.start svg{width:18px;height:18px}
.tasks{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;border-left:2px groove var(--hi);padding-left:5px;margin-left:2px}
.tk{flex:0 1 160px;min-width:0;justify-content:flex-start;font-weight:400;overflow:hidden}
.tk span{overflow:hidden;text-overflow:ellipsis}
.tk svg{width:16px;height:16px;flex:none}
.tk.on{font-weight:700;background:repeating-conic-gradient(var(--face) 0 25%,var(--hi2) 0 50%) 0 0/2px 2px}
.tray{display:flex;align-items:center;gap:8px;padding:2px 10px;min-height:28px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);flex:none}
.tray .dotp{width:10px;height:10px;border-radius:50%;background:var(--sh);border:1px solid #000}
.tray .dotp.on{background:#00d000}
.smenu{position:fixed;left:3px;bottom:38px;z-index:70;display:none;min-width:250px}
.smenu.on{display:flex}
.smenu .band{width:26px;background:linear-gradient(0deg,#000080,#1084d0);color:#fff;font:700 18px var(--f);writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:8px 4px;letter-spacing:1px;flex:none}
html[data-theme="dark"] .smenu .band{background:linear-gradient(0deg,#3a1c71,#4a6fd0)}
.smenu ul{list-style:none;padding:2px;flex:1;margin:0}
.smenu li{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;cursor:pointer;white-space:nowrap}
.smenu li:hover{background:var(--sel);color:var(--selt)}
.smenu li svg{width:20px;height:20px;flex:none}
.smenu hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 2px}

/* boot + dialogs */
.boot{position:fixed;inset:0;background:#000;color:#fff;z-index:200;display:grid;place-items:center;transition:opacity .5s steps(6)}
.boot.off{opacity:0;pointer-events:none}
.boot .in{text-align:center;width:min(360px,80vw)}
.boot .logo{display:grid;grid-template-columns:repeat(2,26px);gap:3px;justify-content:center;margin-bottom:14px;transform:skew(-4deg)}
.boot .logo i{height:22px;display:block}
.boot h2{font:700 26px var(--f);letter-spacing:1px}
.boot h2 small{font-size:14px;font-weight:400;color:#c0c0c0;margin-left:4px}
.boot .pb{height:18px;border:2px solid #c0c0c0;padding:2px;margin:18px auto 8px;background:#000}
.boot .pb i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#1084d0 0 9px,transparent 9px 12px)}
.boot p{color:#a0a0a0;font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:150;padding:16px}
.ov.on{display:grid}
.dlg{width:min(340px,100%);padding:2px}
.dlg .body{padding:12px;text-align:center}
.dlg .qrb{background:#fff;padding:8px;display:inline-block}
.dlg .qrb canvas{display:block;width:240px;height:240px;max-width:100%;image-rendering:pixelated}
.dlg p{font:11px var(--mono);margin:8px 0;word-break:break-all;max-height:3.4em;overflow:hidden}
.pdot2{display:inline-block;width:10px;height:10px;border:1px solid #000;margin-right:6px}
.toast98{position:fixed;right:10px;bottom:46px;z-index:140;padding:6px 14px;background:#ffffe1;color:#000;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.4);display:none}
.toast98.on{display:block;animation:winin .2s steps(4)}

/* mobile: windows stack */
@media (max-width:900px){
  .icons{display:none}
  .desk{display:flex;flex-direction:column;gap:10px;padding:8px 8px 52px}
  .win{position:static!important;width:auto!important;left:auto!important;top:auto!important;min-width:0}
  .win.max{position:static!important;z-index:2!important}
  .tbar{cursor:default}
  .tbb button[data-wa="max"]{display:none}
  .exp{grid-template-columns:1fr;height:auto}
  .tree{max-height:150px}
  .lv{max-height:300px}
  .tasks{display:none}
  .tray{margin-left:auto}
  .lnkrow{flex-direction:column}
  .qrbox98{display:none}
  .tools98 input[type=search]{flex:1;width:auto}
  .tools98 label{flex:1 1 140px}
  .tools98 select{flex:1;min-width:0}
.smenu{min-width:min(280px,calc(100vw - 6px))}
  .props{max-height:150px}
  .lt td{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="theme" hidden aria-hidden="true"></button>
<div class="boot" id="boot"><div class="in"><div class="logo"><i style="background:#ff3b30"></i><i style="background:#34c759"></i><i style="background:#0a84ff"></i><i style="background:#ffd60a"></i></div><h2>Подписка<small>98</small></h2><div class="pb"><i id="bootbar"></i></div><p id="bootp">Загрузка подписки…</p></div></div>

<div class="desk" id="desk">
  <div class="icons" id="icons">
    <div class="ico" data-w="status"><svg class="px" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="9" fill="#c0c0c0" stroke="#000"/><rect x="3" y="4" width="10" height="5" fill="#000080"/><rect x="5" y="12" width="6" height="2" fill="#c0c0c0" stroke="#000"/><rect x="3" y="14" width="10" height="1" fill="#808080"/></svg><span>Состояние</span></div>
    <div class="ico" data-w="link"><svg class="px" viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" fill="#fff" stroke="#000"/><rect x="1" y="3" width="14" height="2" fill="#000080"/><path d="M4 9h4M8 7h4M8 11h4" stroke="#008000" stroke-width="1.4"/></svg><span>Ссылка</span></div>
    <div class="ico" data-w="conn"><svg class="px" viewBox="0 0 16 16"><path d="M1 4h5l1 1h8v9H1z" fill="#ffd33d" stroke="#000"/><path d="M1 6h14" stroke="#c99a00"/></svg><span>Подключения</span></div>
    <div class="ico" data-w="apps"><svg class="px" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" fill="#ff3b30" stroke="#000"/><rect x="9" y="1" width="6" height="6" fill="#34c759" stroke="#000"/><rect x="1" y="9" width="6" height="6" fill="#0a84ff" stroke="#000"/><rect x="9" y="9" width="6" height="6" fill="#ffd60a" stroke="#000"/></svg><span>Приложения</span></div>
  </div>
  <div id="announce" style="position:relative;z-index:3"></div>

  <section class="win" id="w-status" data-w="status">
    <div class="tbar"><svg class="px" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="9" fill="#c0c0c0" stroke="#000"/><rect x="3" y="4" width="10" height="5" fill="#000080"/></svg><span class="tt">Состояние подписки</span><span class="tbb"><button data-wa="min" title="Свернуть">_</button><button data-wa="max" title="Развернуть">▫</button><button data-wa="close" title="Закрыть">✕</button></span></div>
    <div class="mbar"><span>Файл</span><span>Вид</span><span>Справка</span></div>
    <div class="wb" id="b-status"></div>
    <div class="sbar" id="s-status"></div>
  </section>

  <section class="win" id="w-link" data-w="link">
    <div class="tbar"><svg class="px" viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" fill="#fff" stroke="#000"/><rect x="1" y="3" width="14" height="2" fill="#000080"/></svg><span class="tt">Ссылка подписки</span><span class="tbb"><button data-wa="min">_</button><button data-wa="max">▫</button><button data-wa="close">✕</button></span></div>
    <div class="wb" id="b-link"></div>
    <div class="sbar" id="s-link"></div>
  </section>

  <section class="win" id="w-conn" data-w="conn">
    <div class="tbar"><svg class="px" viewBox="0 0 16 16"><path d="M1 4h5l1 1h8v9H1z" fill="#ffd33d" stroke="#000"/></svg><span class="tt">Подключения — Проводник</span><span class="tbb"><button data-wa="min">_</button><button data-wa="max">▫</button><button data-wa="close">✕</button></span></div>
    <div class="mbar"><span>Файл</span><span>Правка</span><span>Вид</span><span>Справка</span></div>
    <div class="wb" id="b-conn">
      <div class="tools98">
        <label>Группа: <select id="gsel"><option value="node">по узлам</option><option value="country">по странам</option><option value="proto">по протоколам</option><option value="list">без групп</option></select></label>
        <label>Протокол: <select id="psel"></select></label>
        <label>Транспорт: <select id="tsel"></select></label>
        <label>Найти: <input id="q" type="search" autocomplete="off"></label>
      </div>
      <div class="tools98">
        <button class="b98 sm" id="bcopy">Копировать ссылку</button><button class="b98 sm" id="bqr">QR-код…</button><button class="b98 sm" id="ball">Копировать все</button><button class="b98 sm" id="bdet">Свойства</button>
      </div>
      <div class="exp"><div class="tree sunk" id="tree"></div><div class="right"><div class="lv sunk" id="lv"></div><div class="props sunk" id="props"></div></div></div>
    </div>
    <div class="sbar" id="s-conn"></div>

  else { o.pk='other'; }

  if(!o.net) o.net=str(o.p.type)||(o.pk==='wg'||o.pk==='awg'?'udp':'tcp');
  if(/amnezia/i.test(o.remark)&&o.pk==='wg') o.pk='awg';
  o.proto=P[o.pk][0]; o.pc=P[o.pk][1];
  /* страна и «чистое» имя */
  var name=o.remark, cc=ccFromEmoji(name);
  name=name.replace(/^\s*[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]\s*/,'').trim();
  var low=name.toLowerCase(), i2;

    else if(name.slice(0,em.length+1)===em+'-') name=name.slice(em.length+1); });

}

function layout(){

  put('status',x1,top0,w1); put('link',x2,top0,w2);

  put('apps',x1,top0+sH+14,w1); put('conn',x2,top0+lH+14,w2);

function bindWindows(){
  WINS.forEach(function(id){
    var w=win(id), tb=w.querySelector('.tbar');

      var dx=e.clientX-w.offsetLeft, dy=e.clientY-w.offsetTop; tb.setPointerCapture(e.pointerId); w.dataset.moved='1';
      function mv(ev){ w.style.left=Math.max(-w.offsetWidth+120,Math.min(window.innerWidth-60,ev.clientX-dx))+'px'; w.style.top=Math.max(0,ev.clientY-dy)+'px'; }
      function up(){ tb.removeEventListener('pointermove',mv); tb.removeEventListener('pointerup',up); var bt=0; WINS.forEach(function(k){ var e=win(k); if(!e.classList.contains('hide')) bt=Math.max(bt,e.offsetTop+e.offsetHeight); }); $('desk').style.height=Math.max(window.innerHeight,bt+60)+'px'; }
      tb.addEventListener('pointermove',mv); tb.addEventListener('pointerup',up);
    });
    tb.addEventListener('dblclick',function(e){ if(!e.target.closest('button')&&!isMobile()) w.classList.toggle('max'); });

      var b=e.target.closest('button'); if(!b) return; var a=b.dataset.wa;

    });

  $('icons').addEventListener('dblclick',function(e){ var i=e.target.closest('.ico'); if(i) openWin(i.dataset.w); });

/* проводник */
var SORT98={node:function(a,b){return ccName(a.cc).localeCompare(ccName(b.cc),'ru');},proto:function(a,b){return P[a.pk][2]-P[b.pk][2];},name:function(a,b){return a.name.localeCompare(b.name,'ru');},
  sec:function(a,b){return (SECRANK[a.sec]||0)-(SECRANK[b.sec]||0);},net:function(a,b){return String(netKey(a)).localeCompare(String(netKey(b)));},port:function(a,b){return num(a.port)-num(b.port);}};
function currentItems(){
  var list=visible(); if(S.g==='list'||!S.grp) return list;
  var gs=groups(list); for(var i=0;i<gs.length;i++) if(S.g+':'+gs[i].key===S.grp) return gs[i].items;
  S.grp=''; return list;
}
function renderSelects(){
  var d=chipsData();
  $('psel').innerHTML='<option value="all">Все ('+d.np+')</option>'+d.pk.map(function(k){return '<option value="'+k+'"'+(S.pf===k?' selected':'')+'>'+P[k][0]+' ('+(d.pc[k]||0)+')</option>';}).join('');
  $('tsel').innerHTML='<option value="all">Все ('+d.nn+')</option>'+d.nk.map(function(k){return '<option value="'+k+'"'+(S.tf===k?' selected':'')+'>'+esc(k==='other'?'Другое':netLabel(k))+' ('+(d.nc[k]||0)+')</option>';}).join('');
  $('psel').value=S.pf; $('tsel').value=S.tf; $('gsel').value=S.g;
}
function renderTree(){
  var list=visible(), h='<div class="tn root'+(!S.grp?' on':'')+'" data-k="">'+ICON.conn+'Все подключения<em>'+list.length+'</em></div>';
  if(S.g!=='list') groups(list).forEach(function(g){
    var k=S.g+':'+g.key, ic;
    if(S.g==='proto') ic='<i class="pdot98" style="background:'+P[g.pk][1]+'"></i>'; else ic=flagC(g.cc);
    var t=S.g==='proto'?P[g.pk][0]:ccName(g.cc);
    h+='<div class="tn lvl'+(S.grp===k?' on':'')+'" data-k="'+esc(k)+'" title="'+esc(S.g==='node'?g.host:t)+'">'+ic+'<span>'+esc(t)+'</span><em>'+g.items.length+'</em></div>';
  });
  $('tree').innerHTML=h;
}
function renderList(){
  var list=currentItems().slice();
  if(S.sort){ var f=SORT98[S.sort.k], d=S.sort.dir; list.sort(function(a,b){ return ((f(a,b))||(a.idx-b.idx))*d; }); }
  var th=[['proto','Протокол'],['name','Название'],['sec','Защита'],['net','Транспорт'],['port','Порт'],['node','Узел']];
  var h='<table class="lt"><thead><tr>'+th.map(function(c){ var on=S.sort&&S.sort.k===c[0]; return '<th data-s="'+c[0]+'">'+c[1]+(on?(S.sort.dir>0?' ▲':' ▼'):'')+'</th>'; }).join('')+'</tr></thead><tbody>';
  list.forEach(function(it){
    h+='<tr class="r'+(S.pick===it.idx?' on':'')+'" data-i="'+it.idx+'"><td><i class="pdot98" style="background:'+it.pc+'"></i>'+esc(it.proto)+'</td><td title="'+esc(it.remark||it.name)+'">'+esc(it.name)+'</td><td>'+esc(secLabel(it.sec))+'</td><td>'+esc(netLabel(it.net))+'</td><td>'+(it.port?esc(it.port):'')+'</td><td>'+esc(ccName(it.cc))+'</td></tr>';
  });
  if(!list.length) h+='<tr><td colspan="6" style="padding:16px">'+(items.length?'Ничего не найдено':'Нет подключений')+'</td></tr>';
  $('lv').innerHTML=h+'</tbody></table>';
  var hosts={}; items.forEach(function(x){hosts[x.host]=1;});
  var cur=items[S.pick];
  $('s-conn').innerHTML='<span>Объектов: '+list.length+(list.length!==items.length?' из '+items.length:'')+'</span><span>Выбрано: '+(cur?esc(cur.name):'—')+'</span><span>Узлов: '+Object.keys(hosts).length+'</span>';
  renderProps();
}
function renderProps(){
  var it=items[S.pick];
  if(!it){ $('props').innerHTML='Выберите подключение в списке, чтобы увидеть свойства.'; return; }
  $('props').innerHTML=detailKV(it).map(function(x){ return '<b>'+esc(x[0])+':</b> '+esc(x[1]); }).join('\n')+'\n<b>Ссылка:</b> '+esc(it.raw);
}
function renderConn(){ renderSelects(); renderTree(); renderList(); }
function bindConn(){
  $('gsel').onchange=function(){ S.g=this.value; S.grp=''; renderConn(); };
  $('psel').onchange=function(){ S.pf=this.value; S.grp=''; renderConn(); };
  $('tsel').onchange=function(){ S.tf=this.value; S.grp=''; renderConn(); };
  $('q').oninput=function(){ S.q=this.value; renderTree(); renderList(); renderSelects(); };
  $('tree').onclick=function(e){ var n=e.target.closest('.tn'); if(!n) return; S.grp=n.dataset.k; renderTree(); renderList(); };
  $('lv').onclick=function(e){
    var th=e.target.closest('th'); if(th){ var k=th.dataset.s; if(S.sort&&S.sort.k===k){ if(S.sort.dir>0) S.sort.dir=-1; else S.sort=null; } else S.sort={k:k,dir:1}; renderList(); return; }
    var tr=e.target.closest('tr.r'); if(tr){ S.pick=+tr.dataset.i; renderList(); }
  };
  $('lv').ondblclick=function(e){ var tr=e.target.closest('tr.r'); if(tr) copy(items[+tr.dataset.i].raw); };
  $('bcopy').onclick=function(){ var it=items[S.pick]; if(it) copy(it.raw); else toast('Выберите подключение'); };
  $('bqr').onclick=function(){ var it=items[S.pick]; if(it) openQR(it.raw,it.proto+' · '+it.name,it.pc); else toast('Выберите подключение'); };
  $('ball').onclick=function(){ copyAllOf(currentItems()); };
  $('bdet').onclick=function(){ var p=$('props'); p.style.display=p.style.display==='none'?'':'none'; this.classList.toggle('on',p.style.display==='none'); };

/* пуск, часы, загрузка */
function smItem(ic,t,fn,href){ return {ic:ic,t:t,fn:fn,href:href}; }

window.onTick=function(){ var d=new Date(); $('clock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); };
function bootSeq(done){
  var bar=$('bootbar'), msgs=['Загрузка подписки…','Разбор ссылок…','Подключение узлов…','Готово'], i=0;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ $('boot').style.display='none'; done(); return; }

function bindQR98(){ bindQR(); $('mclose2').onclick=closeQR; }

headCommon(); loadItems(); buildSub(); bindQR98(); bindWindows(); bindConn(); bindStart();
renderStatus(true); renderLink(); renderApps(); renderConn(); renderStart(); window.onTick();
layout(); renderTasks(); focusWin('conn');
window.addEventListener('resize',layout); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout); setTimeout(layout,300);

/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
