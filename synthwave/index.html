<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0221'/%3E%3Ccircle cx='16' cy='15' r='9' fill='%23ff2e97'/%3E%3Crect y='20' width='32' height='12' fill='%230d0221'/%3E%3Cpath d='M0 22h32M0 26h32M8 20l-6 12M16 20v12M24 20l6 12' stroke='%2300f0ff' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
:root{
  --s1:#0d0221; --s2:#2a0845; --s3:#6a1b9a; --hz:#ff2e97; --pink:#ff2e97; --cyan:#00f0ff; --yel:#ffe45e; --pur:#b967ff;
  --tx:#f5ecff; --mu:#b79adb; --fa:#7a5da0; --pn:rgba(18,5,44,.72); --pn2:rgba(255,255,255,.06); --ln:rgba(0,240,255,.35); --ln2:rgba(255,46,151,.4);
  --grid:rgba(255,46,151,.75); --glowc:0 0 18px rgba(0,240,255,.45); --glowp:0 0 18px rgba(255,46,151,.5);
  --ok:#3dffa8; --warn:#ffe45e; --bad:#ff4d6d;
  --f:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --disp:"Arial Black","Impact","Segoe UI Black","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:dark;
}
html[data-theme="light"]{
  --s1:#ffe8f4; --s2:#ffd3b8; --s3:#9fe8ff; --hz:#ff7ab8; --pink:#e0007a; --cyan:#007f96; --yel:#ff9f1a; --pur:#7b2cbf;
  --tx:#2a0845; --mu:#6a4a8a; --fa:#a58bc2; --pn:rgba(255,255,255,.74); --pn2:rgba(120,40,160,.07); --ln:rgba(0,127,150,.45); --ln2:rgba(224,0,122,.45);
  --grid:rgba(123,44,191,.6); --glowc:0 0 14px rgba(0,127,150,.25); --glowp:0 0 14px rgba(224,0,122,.25);
  --ok:#0a9f68; --warn:#c77700; --bad:#d6334a; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f);color:var(--tx);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--s1) 0,var(--s2) 520px,var(--s1) 900px);background-color:var(--s1)}
html[data-theme="light"] body{background:linear-gradient(180deg,#fff0f8 0,var(--s2) 420px,#e9f9ff 900px);background-color:#fff0f8}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--pink);color:#fff}
.mono{font-family:var(--mono)}
.stars{position:absolute;left:0;top:0;width:100%;height:560px;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
html[data-theme="light"] .stars{opacity:.25}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 80px}

/* top bar */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 0}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font:italic 900 15px var(--disp);letter-spacing:.14em;text-transform:uppercase}
.brand i{width:18px;height:18px;border-radius:50%;background:linear-gradient(var(--yel),var(--pink));box-shadow:var(--glowp);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px var(--mono);letter-spacing:0;color:var(--mu);text-transform:none}
.nb{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;transition:.2s;flex:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nb:hover{box-shadow:var(--glowc);border-color:var(--cyan)}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="dark"] .t-moon,html[data-theme="light"] .t-sun{display:none}

/* scene */
.scene{position:relative;height:clamp(330px,52vw,520px);margin:0 -20px;overflow:hidden}
.sun{position:absolute;left:50%;bottom:34%;width:min(58vw,360px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--yel) 8%,#ff8a3d 40%,var(--pink) 78%);
  -webkit-mask-image:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 62%,transparent 62% 67%,#000 67% 73%,transparent 73% 79%,#000 79% 86%,transparent 86% 92%,#000 92%);
  mask-image:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 62%,transparent 62% 67%,#000 67% 73%,transparent 73% 79%,#000 79% 86%,transparent 86% 92%,#000 92%);
  filter:drop-shadow(0 0 40px rgba(255,46,151,.55));animation:sunp 6s ease-in-out infinite alternate}
@keyframes sunp{to{filter:drop-shadow(0 0 70px rgba(255,120,60,.75));transform:translateX(-50%) scale(1.03)}}
.hz{position:absolute;left:0;right:0;bottom:34%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),var(--cyan),transparent);box-shadow:0 0 16px var(--cyan),0 0 30px var(--pink)}
.floor{position:absolute;left:-30%;right:-30%;bottom:0;height:34%;perspective:260px;perspective-origin:50% 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-100%;transform:rotateX(64deg);transform-origin:50% 0;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:56px 56px;animation:grid 1.4s linear infinite;filter:drop-shadow(0 0 4px var(--pink))}
@keyframes grid{to{background-position:0 56px,0 0}}
.mount{position:absolute;left:0;right:0;bottom:34%;height:15%;filter:drop-shadow(0 -2px 0 var(--cyan)) drop-shadow(0 -8px 14px rgba(0,240,255,.35))}
.mount i{position:absolute;inset:0;background:linear-gradient(#1b0636,#0d0221);clip-path:polygon(0 100%,0 62%,7% 38%,12% 58%,20% 14%,29% 66%,36% 44%,44% 78%,50% 52%,58% 82%,66% 30%,75% 70%,83% 22%,91% 60%,96% 44%,100% 66%,100% 100%)}
html[data-theme="light"] .mount i{background:linear-gradient(#c9a8f5,#9b72e0)}
.titl{position:absolute;left:0;right:0;top:6%;text-align:center;z-index:2;padding:0 14px}
.titl h1{font:italic 900 clamp(38px,9vw,92px)/.95 var(--disp);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere;
  background:linear-gradient(#fff 0 46%,#7fe9ff 46% 54%,var(--pink) 54%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,46,151,.65)) drop-shadow(3px 3px 0 rgba(0,240,255,.5));animation:flick 5s steps(1) infinite}
html[data-theme="light"] .titl h1{background:linear-gradient(#7b2cbf 0 46%,#ff7ab8 46% 54%,#e0007a 54%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(2px 2px 0 rgba(0,127,150,.45))}
@keyframes flick{0%,92%,96%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}95%{opacity:.4}}
.titl p{margin-top:8px;font:700 13px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}

/* panels */
.neon{background:var(--pn);border:1px solid var(--ln);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,46,151,.12),var(--glowc),0 0 50px rgba(255,46,151,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px;position:relative}
.neon.p{border-color:var(--ln2);box-shadow:inset 0 0 0 1px rgba(0,240,255,.1),var(--glowp)}
.neon>h2{font:italic 900 13px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 8px var(--cyan);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.neon>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}
.neon.p>h2{color:var(--pink);text-shadow:0 0 8px var(--pink)}
.neon.p>h2::after{background:linear-gradient(90deg,var(--pink),transparent)}
.announce{margin:10px 0 0;padding:10px 14px;border-radius:12px;border:1px dashed var(--yel);color:var(--yel);font-weight:650;text-align:center;position:relative;z-index:3}
.console{margin-top:-70px;position:relative;z-index:4;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
.eq{grid-column:1/-1;display:flex;align-items:flex-end;gap:4px;height:74px;margin:4px 0 8px}
.eq i{flex:1;display:block;border-radius:2px 2px 0 0;background:var(--fa);opacity:.35;min-height:6px}
.eq i.f{opacity:1;background:linear-gradient(0deg,var(--cyan),var(--pink));box-shadow:0 0 8px rgba(255,46,151,.55);animation:bounce var(--d,1.1s) ease-in-out infinite alternate;transform-origin:bottom}
@keyframes bounce{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.eq.warn i.f{background:linear-gradient(0deg,var(--yel),#ff8a3d)}.eq.bad i.f{background:linear-gradient(0deg,#ff4d6d,#ff9a3d)}
.big{font:italic 900 clamp(50px,9vw,96px)/.9 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 40px var(--pink)}
html[data-theme="light"] .big{color:var(--pur);text-shadow:2px 2px 0 rgba(0,127,150,.35)}
.big small{font-size:.28em;color:var(--cyan);margin-left:.25em;letter-spacing:.06em;text-shadow:0 0 8px var(--cyan)}
.of{color:var(--mu);font-weight:650;margin:6px 0 10px;font-size:14px}
.lab{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.val{font:italic 900 24px/1.15 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.val.ok{color:var(--ok);text-shadow:0 0 10px var(--ok)}.val.warn{color:var(--warn);text-shadow:0 0 10px var(--warn)}.val.bad{color:var(--bad);text-shadow:0 0 10px var(--bad)}
.val.mono{font-family:var(--mono);font-style:normal;font-size:22px;letter-spacing:-.04em;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.kvs{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:14px}
.kvs div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(183,154,219,.3);padding-bottom:4px}
.kvs span{color:var(--mu)}.kvs b{font-family:var(--mono);font-weight:700;letter-spacing:-.03em}
.dotp{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:8px;animation:ping 2s infinite;vertical-align:1px}
@keyframes ping{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.two{display:grid;grid-template-columns:390px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.fseg{display:flex;padding:3px;border-radius:12px;background:var(--pn2);gap:3px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.06)}
.fseg button{flex:1;height:34px;padding:0 12px;border-radius:9px;font:700 12.5px var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);white-space:nowrap;transition:.2s}
.fseg button.on{background:linear-gradient(135deg,var(--pink),var(--pur));color:#fff;box-shadow:var(--glowp)}
.urlbox{font:600 13px/1.55 var(--mono);word-break:break-all;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--ln);color:var(--cyan);text-shadow:0 0 8px rgba(0,240,255,.5)}
html[data-theme="light"] .urlbox{background:rgba(255,255,255,.8);color:var(--pur);text-shadow:none}
.urlbox.flash{animation:fl .6s}
@keyframes fl{from{box-shadow:0 0 0 2px var(--yel),0 0 24px var(--yel)}}
.cta{display:flex;gap:8px;margin-top:12px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;gap:9px;font:800 12.5px var(--f);letter-spacing:.08em;text-transform:uppercase;transition:.2s;background:var(--pn2);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glowc);border-color:var(--cyan)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{flex:1;background:linear-gradient(135deg,var(--pink),var(--pur));color:#fff;border-color:transparent;box-shadow:var(--glowp)}
.btn.ok svg{display:none}.btn.ok::before{content:"✓";font-weight:900}
.qrw{margin:16px auto 0;background:#fff;border-radius:14px;padding:10px;width:170px;height:170px;box-shadow:0 0 0 2px var(--pink),0 0 30px rgba(255,46,151,.55)}
.qrw canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.appc{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 2px 9px;border-radius:14px;background:var(--pn2);border:1px solid rgba(255,255,255,.06);font-size:12px;font-weight:700;transition:.25s}
.appc:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:var(--glowc)}
.ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.4)}
.ai svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1 1 200px;height:44px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px;transition:.2s}
html[data-theme="light"] .search{background:rgba(255,255,255,.8)}
.search:focus-within{border-color:var(--pink);box-shadow:var(--glowp)}
.search svg{width:17px;height:17px;stroke:var(--mu);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit}
.search kbd{font:700 11px var(--mono);color:var(--mu);border:1px solid var(--fa);border-radius:5px;padding:0 6px}
.search:focus-within kbd{display:none}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--pn2);gap:2px;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.06)}
.seg::-webkit-scrollbar,.cw::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 13px;border-radius:9px;font:700 12px var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);white-space:nowrap;flex:none;transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--cyan),var(--pur));color:#0d0221}
.ibtn{width:44px;height:44px;border-radius:12px;background:var(--pn2);border:1px solid var(--ln);display:grid;place-items:center;transition:.2s}
.ibtn:hover{border-color:var(--cyan);box-shadow:var(--glowc)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ok{background:var(--ok);color:#06140d}.ibtn.ok svg{display:none}.ibtn.ok::before{content:"✓";font-weight:900}
.filters{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.crow{display:flex;align-items:center;gap:10px}
.cl{font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa);width:82px;flex:none}
.cw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.fchip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--ln);font:700 12px var(--f);color:var(--mu);display:inline-flex;align-items:center;gap:7px;transition:.2s;flex:none}
.fchip:hover{color:var(--tx);border-color:var(--cyan)}
.fchip.on{background:var(--cyan);color:#0d0221;border-color:var(--cyan);box-shadow:var(--glowc)}
html[data-theme="light"] .fchip.on{color:#fff}
.fchip.dim{opacity:.38}
.fchip i{width:8px;height:8px;border-radius:50%;display:block}
.fchip em{font-style:normal;opacity:.65}
.sumrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
.sum{color:var(--mu);font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.mini-actions{display:flex;gap:8px}
.mini-actions .ibtn{width:38px;height:38px}

.gc{border:1px solid var(--ln);border-radius:16px;background:rgba(0,0,0,.2);margin-bottom:10px;overflow:hidden}
html[data-theme="light"] .gc{background:rgba(255,255,255,.55)}
.gc.an{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.gh{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none;transition:background .2s}
.gh:hover{background:var(--pn2)}
.gh:focus-visible{outline:2px solid var(--pink);outline-offset:-2px}
.gh .flag{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--pink),0 0 14px rgba(255,46,151,.5)}
.gh .flag-e{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:var(--pn2)}
.gt{min-width:0;flex:1}
.gt b{display:block;font:italic 900 15px var(--disp);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{display:block;color:var(--mu);font:500 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdots{display:flex;gap:4px}.pdots i{width:8px;height:8px;border-radius:50%;display:block}
.cnt{min-width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--pur));color:#0d0221;font:900 12.5px var(--f);display:grid;place-items:center;padding:0 8px}
.pdot{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:0 0 14px currentColor}
.cbtn{width:34px;height:34px;border-radius:10px;background:var(--pn2);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;transition:.2s;flex:none}
.cbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.cbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cbtn.ok{background:var(--ok);color:#06140d;border-color:transparent}.cbtn.ok svg{display:none}.cbtn.ok::before{content:"✓";font-weight:900}
.chev{width:19px;height:19px;stroke:var(--mu);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s;flex:none}
.gc.closed .chev{transform:rotate(-90deg)}
.rowsw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.3,.8,.2,1)}
.rowsw>.rows{overflow:hidden;min-height:0}
.gc.closed .rowsw{grid-template-rows:0fr}
.row{border-top:1px solid rgba(183,154,219,.18)}
.rm{display:grid;grid-template-columns:104px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 14px;transition:background .18s}
.rm:hover{background:var(--pn2)}
.pk{height:28px;border-radius:8px;display:grid;place-items:center;font:800 11.5px var(--f);letter-spacing:.04em;padding:0 8px;white-space:nowrap;cursor:pointer;color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 55%,transparent),0 0 12px color-mix(in srgb,var(--pc) 25%,transparent)}
.nm{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.nm b{font-weight:700;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;flex:none}
.tag{font:700 11px var(--f);padding:2px 9px;border-radius:7px;background:var(--pn2);color:var(--mu);border:1px solid rgba(255,255,255,.07)}
.tag.sec-reality{color:var(--pur);border-color:color-mix(in srgb,var(--pur) 60%,transparent)}
.tag.sec-tls{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 60%,transparent)}
.tag.sec-none{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.port{font:800 14.5px var(--mono);letter-spacing:-.04em;text-align:right;white-space:nowrap;color:var(--yel);text-shadow:0 0 8px rgba(255,228,94,.45)}
html[data-theme="light"] .port{color:var(--pink);text-shadow:none}
.port span{color:var(--fa)}
.ab{display:flex;gap:6px}
.row.open .cbtn.tg svg{transform:rotate(180deg)}
.cbtn.tg svg{transition:transform .25s}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.3,.8,.2,1)}
.row.open .detail{grid-template-rows:1fr}
.detail .in{overflow:hidden;min-height:0}
.detail .pad{padding:2px 14px 14px 130px}

  o.proto=P[o.pk][0]; o.pc=P[o.pk][1];

  name=name.replace(/^\s*[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]\s*/,'').trim();

  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); st=[]; for(i=0;i<Math.round(W*H/5000);i++) st.push({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.4+.3,p:Math.random()*6.3,s:.5+Math.random()*1.8}); }
  function draw(t){ ctx.clearRect(0,0,W,H); var light=document.documentElement.getAttribute('data-theme')==='light';
    for(i=0;i<st.length;i++){ var s=st[i], a=.2+.8*(.5+.5*Math.sin(t/1000*s.s+s.p)); ctx.fillStyle=(light?'rgba(123,44,191,':'rgba(255,255,255,')+(a*(light?.5:.95)).toFixed(2)+')'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill(); } }
  var last=0; function loop(t){ if(!document.hidden&&t-last>50){ draw(t); last=t; } requestAnimationFrame(loop); }
  size(); window.addEventListener('resize',size); if(still) draw(0); else requestAnimationFrame(loop);
})();

headCommon(); loadItems(); buildSub(); bindQR(); bindGroups();
renderConsole(true); renderUrls(); renderChips(); renderGroups(true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeQR(); return; }
  var tg=(e.target.tagName||'').toLowerCase();
  if(e.key==='/'&&tg!=='input'&&tg!=='textarea'){ e.preventDefault(); $('q').focus(); }
});

/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
