<style>

 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.row{border-top:1px solid var(--ln)}

.modal h3{font:800 18px var(--f);display:flex;gap:10px;align-items:center;justify-content:center}.pdot2{width:11px;height:11px;border-radius:50%;display:inline-block}

}
@media (hover:none){.spot::before,.spot::after{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none;filter:none}.cur{display:none}}

body{background:var(--bg)}

function detailKV(it){ return [['Адрес',it.host],['Порт',it.port],['Протокол',it.proto],['Безопасность',secLabel(it.sec)],['Транспорт',netLabel(it.net)],['SNI',it.p.sni||it.p.host],['Flow',it.p.flow],

function chipsData(){

var FX={mx:0,my:0,cx:0,cy:0,raf:0,io:null};
function fxInit(){
  var root=document.documentElement, cur=document.querySelector('.cur'), fine=window.matchMedia&&matchMedia('(hover:hover)').matches;
  function paintSpots(x,y){
    var els=document.querySelectorAll('.spot'),i,r,el;
    for(i=0;i<els.length;i++){ el=els[i]; r=el.getBoundingClientRect(); if(r.bottom<-50||r.top>innerHeight+50) continue; el.style.setProperty('--mx',(x-r.left)+'px'); el.style.setProperty('--my',(y-r.top)+'px'); }
  }
  var pend=false,px=0,py=0;
  if(fine){
    document.addEventListener('pointermove',function(e){
      FX.mx=e.clientX; FX.my=e.clientY; px=e.clientX; py=e.clientY;
      if(!pend){ pend=true; requestAnimationFrame(function(){ pend=false; paintSpots(px,py); }); }
      var t=e.target.closest&&e.target.closest('.tilt');
      if(t){ var r=t.getBoundingClientRect(), dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5, k=+(t.dataset.tilt||6); t.classList.add('hot'); t.style.setProperty('--ry',(dx*k).toFixed(2)+'deg'); t.style.setProperty('--rx',(-dy*k).toFixed(2)+'deg'); }
      var m=e.target.closest&&e.target.closest('.mag');
      if(m){ var q=m.getBoundingClientRect(); m.style.transform='translate('+((e.clientX-q.left-q.width/2)*.18).toFixed(1)+'px,'+((e.clientY-q.top-q.height/2)*.28).toFixed(1)+'px)'; }
    },{passive:true});
    document.addEventListener('pointerout',function(e){
      var t=e.target.closest&&e.target.closest('.tilt'); if(t&&!t.contains(e.relatedTarget)){ t.classList.remove('hot'); t.style.setProperty('--rx','0deg'); t.style.setProperty('--ry','0deg'); }
      var m=e.target.closest&&e.target.closest('.mag'); if(m&&!m.contains(e.relatedTarget)) m.style.transform='';
    });
    (function loop(){ FX.cx+=(FX.mx-FX.cx)*.08; FX.cy+=(FX.my-FX.cy)*.08; if(cur){ cur.style.setProperty('--cx',FX.cx.toFixed(0)+'px'); cur.style.setProperty('--cy',FX.cy.toFixed(0)+'px'); } requestAnimationFrame(loop); })();
  }
  var tk=false;
  function onScroll(){
    tk=false; var y=window.scrollY||0, h=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    root.style.setProperty('--prog',Math.min(1,y/h).toFixed(4)); root.style.setProperty('--sy',y.toFixed(0)); root.style.setProperty('--sp',Math.min(1,y/420).toFixed(3));
    document.body.classList.toggle('scrolled',y>60);
    if(fine) paintSpots(FX.mx,FX.my);
  }
  window.addEventListener('scroll',function(){ if(!tk){ tk=true; requestAnimationFrame(onScroll); } },{passive:true}); onScroll();
  if('IntersectionObserver' in window){ FX.io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); FX.io.unobserve(e.target); } }); },{threshold:.08,rootMargin:'0px 0px -6% 0px'}); }
  fxScan();
}
