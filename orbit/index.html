<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23050712'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%235cf0ff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238b6cff' stroke-width='1.6' stroke-dasharray='3 3'/%3E%3Ccircle cx='25' cy='12' r='2.2' fill='%23ff5ecb'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#050712; --bg2:#0a0e24; --pn:rgba(255,255,255,.045); --pn2:rgba(255,255,255,.075); --ln:rgba(160,175,255,.14); --ln2:rgba(160,175,255,.3);
  --tx:#e9edff; --mu:#8f98c2; --fa:#566090; --a1:#5cf0ff; --a2:#8b6cff; --a3:#ff5ecb; --ok:#46f0a6; --warn:#ffc15a; --bad:#ff6b7f;
  --grad:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));
  --glow:0 0 24px color-mix(in srgb,var(--a1) 35%,transparent);
  --f:"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#e8eeff; --bg2:#f6f1ff; --pn:rgba(255,255,255,.66); --pn2:rgba(255,255,255,.9); --ln:rgba(60,70,150,.14); --ln2:rgba(60,70,150,.3);
  --tx:#121a3d; --mu:#566091; --fa:#8f98c2; --a1:#0a8dff; --a2:#6a45ff; --a3:#e0399e; --ok:#0a9f68; --warn:#d98200; --bad:#d6334a;
  --glow:0 0 24px color-mix(in srgb,var(--a1) 25%,transparent); color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f);color:var(--tx);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1100px 700px at 50% -10%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--a2);color:#fff}
.mono{font-family:var(--mono)}
.stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html[data-theme="light"] .stars{opacity:.35}
.app{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 22px 80px}

.top{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 35% 30%,#fff,var(--a1) 30%,var(--a2) 70%);box-shadow:var(--glow)}
.logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed var(--ln2);animation:spin 14s linear infinite}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mu);font:500 11.5px var(--mono)}
.rb{width:42px;height:42px;border-radius:50%;background:var(--pn);border:1px solid var(--ln);display:inline-grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s;flex:none}
.rb:hover{border-color:var(--a1);box-shadow:var(--glow)}
.rb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="dark"] .t-moon,html[data-theme="light"] .t-sun{display:none}
.announce{margin:6px 0 8px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);font-weight:600;font-size:14px}

/* ---------- stage */
.stage{position:relative;padding:6px 0 0}
.orbits{position:relative;width:min(100%,640px);aspect-ratio:1;margin:0 auto;container-type:inline-size;overflow:hidden}
.rg{position:absolute;left:50%;top:50%;width:calc(var(--r)*2cqw);height:calc(var(--r)*2cqw);transform:translate(-50%,-50%);border:1px dashed var(--ln);border-radius:50%}
.rg::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;border-top-color:var(--ln2);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:absolute;inset:0;animation:spin var(--T,150s) linear infinite}
.orb.rev,.orb.rev .nbi{animation-direction:reverse}
.orb.rev .nbi{animation-direction:normal}
.stage:hover .orb,.stage:hover .nbi{animation-play-state:paused}
.spoke{position:absolute;left:50%;top:50%;height:1px;width:calc(var(--r)*1cqw);transform-origin:0 50%;transform:rotate(var(--a));background:linear-gradient(90deg,transparent 22%,color-mix(in srgb,var(--a1) 55%,transparent));opacity:.55;transition:opacity .3s}
.spoke::after{content:"";position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1);animation:travel 3.8s linear infinite;animation-delay:var(--d,0s)}
@keyframes travel{0%{left:20%;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
.stage.sel .spoke{opacity:.1}
.stage.sel .spoke.on{opacity:1}
.nb{position:absolute;left:50%;top:50%;width:calc(var(--bs)*1cqw);height:calc(var(--bs)*1cqw);margin:calc(var(--bs)*-.5cqw) 0 0 calc(var(--bs)*-.5cqw);z-index:3;
  transform:rotate(var(--a)) translateX(calc(var(--r)*1cqw)) rotate(calc(var(--a)*-1))}
.nbi{position:absolute;inset:0;animation:spin var(--T,150s) linear infinite reverse}
.fw{position:absolute;inset:0;border-radius:50%;transition:transform .35s cubic-bezier(.3,1.5,.4,1),opacity .3s;cursor:pointer}
.fw .flag{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--ln2),0 6px 20px rgba(0,0,0,.4)}
.fw .flag-e{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--bs)*.55cqw);background:var(--pn2);box-shadow:0 0 0 2px var(--ln2)}
.nb:hover .fw{transform:scale(1.18)}
.nb.on .fw{transform:scale(1.32)}
.nb.on .fw .flag,.nb.on .fw .flag-e{box-shadow:0 0 0 3px var(--a1),0 0 26px var(--a1)}
.nb.on .fw::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--a1);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
.stage.sel .nb:not(.on) .fw{opacity:.38}
.cb{position:absolute;right:-5px;top:-5px;min-width:calc(var(--bs)*.42cqw);height:calc(var(--bs)*.42cqw);padding:0 4px;border-radius:99px;background:var(--grad);color:#fff;font:800 max(10px,calc(var(--bs)*.26cqw)) var(--f);display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.nl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:max(10.5px,1.9cqw);font-weight:650;color:var(--mu);text-shadow:0 1px 6px var(--bg);pointer-events:none;transition:.25s}
.nb.on .nl,.nb:hover .nl{color:var(--tx)}
.core{position:absolute;left:50%;top:50%;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:2;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--a2) 28%,var(--bg)),var(--bg) 72%);box-shadow:inset 0 0 40px rgba(0,0,0,.4),0 0 70px color-mix(in srgb,var(--a2) 45%,transparent),0 0 0 1px var(--ln2)}
.core::before{content:"";position:absolute;inset:-9%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 30%,transparent),transparent 68%);animation:halo 4s ease-in-out infinite;z-index:-1}
@keyframes halo{50%{transform:scale(1.1);opacity:.65}}
.core.warn{box-shadow:inset 0 0 40px rgba(0,0,0,.4),0 0 70px color-mix(in srgb,var(--warn) 45%,transparent),0 0 0 1px var(--warn)}
.core.bad{box-shadow:inset 0 0 40px rgba(0,0,0,.4),0 0 70px color-mix(in srgb,var(--bad) 45%,transparent),0 0 0 1px var(--bad)}
.core svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.core .bgc{fill:none;stroke:var(--ln);stroke-width:5}
.core .fgc{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px var(--a1))}
.core .ct{position:relative;text-align:center;line-height:1}
.core .cn{font-size:max(34px,9.2cqw);font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--tx),color-mix(in srgb,var(--tx) 60%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.core .cn small{font-size:.36em;letter-spacing:0;margin-left:.15em;font-weight:700;-webkit-text-fill-color:var(--mu)}
.core .cs{margin-top:.5em;font-size:max(11px,2.1cqw);color:var(--mu);font-weight:600}

.huds{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;min-width:190px;max-width:260px;padding:14px 16px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hud:nth-child(1){left:0;top:10px}
.hud:nth-child(2){right:0;top:10px;text-align:right;animation-delay:.1s}
.hud:nth-child(3){left:0;bottom:10px;animation-delay:.2s}
.hud:nth-child(4){right:0;bottom:10px;text-align:right;animation-delay:.3s}
.hl{font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa);margin-bottom:6px}
.hv{font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.hv.mono{font-family:var(--mono);font-size:20px;letter-spacing:-.04em}
.hs{color:var(--mu);font-size:12.5px;margin-top:3px}
.hv.ok{color:var(--ok)}.hv.warn{color:var(--warn)}.hv.bad{color:var(--bad)}
.dotl{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hr{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:2px 0}
.hud:nth-child(3) .hr,.hud:nth-child(4) .hr{justify-content:space-between}
.hr span{color:var(--mu)}.hr b{font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.03em}

/* ---------- dock of nodes */
.dock{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dock::-webkit-scrollbar{display:none}
.dc{flex:none;height:44px;padding:0 15px 0 8px;border-radius:99px;background:var(--pn);border:1px solid var(--ln);display:inline-flex;align-items:center;gap:9px;font-weight:650;font-size:14px;color:var(--mu);transition:.2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dc:hover{color:var(--tx);border-color:var(--ln2)}
.dc .flag{width:30px;height:30px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--ln2)}
.dc .flag-e{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--pn2)}
.dc .allic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:15px}
.dc em{font-style:normal;font-size:12px;font-weight:800;background:var(--pn2);border-radius:99px;padding:1px 8px;color:var(--tx)}
.dc.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.dc.on em{background:rgba(255,255,255,.25)}

/* ---------- panels */
.two{display:grid;grid-template-columns:392px minmax(0,1fr);gap:18px;align-items:start;margin-top:14px}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:28px;padding:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:16px;animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) both}
.panel h3{font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--fa);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h3::before{content:"";width:18px;height:2px;background:var(--grad);border-radius:2px}
.fseg{display:flex;padding:4px;border-radius:99px;background:var(--pn2);gap:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.fseg button{flex:1;height:36px;padding:0 12px;border-radius:99px;font-weight:650;font-size:13px;color:var(--mu);white-space:nowrap;transition:.2s}
.fseg button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.urlbox{font:600 13.5px/1.55 var(--mono);word-break:break-all;padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid var(--ln);color:var(--a1)}
html[data-theme="light"] .urlbox{background:rgba(255,255,255,.7);color:var(--a2)}
.urlbox.flash{animation:fl .6s}
@keyframes fl{from{border-color:var(--a1);box-shadow:var(--glow)}}
.cta{display:flex;gap:8px;margin-top:12px}
.btn{height:46px;padding:0 20px;border-radius:99px;border:1px solid var(--ln2);display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:14px;transition:.2s;white-space:nowrap;background:var(--pn)}
.btn:hover{transform:translateY(-2px);border-color:var(--a1)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow);flex:1}
.btn.sm{height:38px;padding:0 15px;font-size:13px}
.btn.ok svg{display:none}.btn.ok::before{content:"✓";font-weight:800}
.qrw{margin:16px auto 0;background:#fff;border-radius:22px;padding:12px;width:168px;height:168px;box-shadow:0 0 0 1px var(--ln2),var(--glow)}
.qrw canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.appc{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:18px;background:var(--pn2);border:1px solid var(--ln);font-size:12px;font-weight:650;transition:.25s}
.appc:hover{transform:translateY(-3px);border-color:var(--a1);box-shadow:var(--glow)}
.ai{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 14px rgba(0,0,0,.3)}
.ai svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1 1 220px;height:46px;border-radius:99px;background:var(--pn2);border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 16px;transition:.2s}
.search:focus-within{border-color:var(--a1);box-shadow:var(--glow)}
.search svg{width:18px;height:18px;stroke:var(--mu);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit}
.search kbd{font:600 11px var(--mono);color:var(--mu);border:1px solid var(--ln2);border-radius:6px;padding:1px 6px}
.search:focus-within kbd{display:none}
.seg{display:flex;padding:4px;border-radius:99px;background:var(--pn2);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar,.cw::-webkit-scrollbar{display:none}
.seg button{height:38px;padding:0 14px;border-radius:99px;font-weight:650;font-size:13px;color:var(--mu);white-space:nowrap;flex:none;transition:.2s}
.seg button.on{background:var(--tx);color:var(--bg)}
.mini-actions{display:flex;gap:8px;margin-left:auto}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--pn2);border:1px solid var(--ln);display:grid;place-items:center;transition:.2s}
.ibtn:hover{border-color:var(--a1)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ok{background:var(--ok);color:#06140d}.ibtn.ok svg{display:none}.ibtn.ok::before{content:"✓";font-weight:800}
.filters{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.crow{display:flex;align-items:center;gap:10px}
.cl{font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fa);width:82px;flex:none}
.cw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.fchip{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--ln);font-size:12.5px;font-weight:650;color:var(--mu);display:inline-flex;align-items:center;gap:7px;transition:.2s;flex:none}
.fchip:hover{color:var(--tx);border-color:var(--ln2)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fchip.dim{opacity:.38}
.fchip i{width:8px;height:8px;border-radius:50%;display:block}
.fchip em{font-style:normal;opacity:.6;font-size:11.5px}
.sumrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
.sum{color:var(--mu);font-size:13px;font-weight:600}
.nfil{display:none;align-items:center;gap:8px;height:32px;padding:0 6px 0 12px;border-radius:99px;background:var(--grad);color:#fff;font-size:12.5px;font-weight:700}
.nfil.on{display:inline-flex}
.nfil button{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px}

.gc{border:1px solid var(--ln);border-radius:22px;background:var(--pn2);margin-bottom:10px;overflow:hidden}
.gc.an{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.gh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .2s}
.gh:hover{background:var(--pn)}
.gh:focus-visible{outline:2px solid var(--a1);outline-offset:-2px}
.gh .flag{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--ln2)}
.gh .flag-e{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:var(--pn2)}
.gt{min-width:0;flex:1}
.gt b{display:block;font-size:16px;font-weight:720;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{display:block;color:var(--mu);font:500 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdots{display:flex;gap:4px}.pdots i{width:8px;height:8px;border-radius:50%;display:block}
.cnt{min-width:26px;height:26px;border-radius:99px;background:var(--grad);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center;padding:0 8px}
.pdot{width:32px;height:32px;border-radius:11px;flex:none}
.cbtn{width:34px;height:34px;border-radius:50%;background:var(--pn);border:1px solid var(--ln);display:grid;place-items:center;transition:.2s;flex:none}
.cbtn:hover{border-color:var(--a1);color:var(--a1)}
.cbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cbtn.ok{background:var(--ok);color:#06140d;border-color:transparent}.cbtn.ok svg{display:none}.cbtn.ok::before{content:"✓";font-weight:800}
.chev{width:19px;height:19px;stroke:var(--mu);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s;flex:none}
.gc.closed .chev{transform:rotate(-90deg)}
.rowsw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.3,.8,.2,1)}
.rowsw>.rows{overflow:hidden;min-height:0}
.gc.closed .rowsw{grid-template-rows:0fr}
.row{border-top:1px solid var(--ln)}
.rm{display:grid;grid-template-columns:104px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 14px;transition:background .18s}
.rm:hover{background:var(--pn)}
.pk{height:28px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:.02em;padding:0 8px;white-space:nowrap;cursor:pointer;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 40%,transparent)}

.tags{display:flex;gap:5px;flex:none}

.port{font:700 14.5px var(--mono);letter-spacing:-.04em;text-align:right;white-space:nowrap}
.port span{color:var(--fa)}
.ab{display:flex;gap:6px}
.row.open .cbtn.tg svg{transform:rotate(180deg)}
.cbtn.tg svg{transition:transform .25s}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.3,.8,.2,1)}
.row.open .detail{grid-template-rows:1fr}
.detail .in{overflow:hidden;min-height:0}
.detail .pad{padding:2px 14px 14px 130px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.kv div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:7px 11px;min-width:0}
.kv span{display:block;font:700 10px var(--mono);color:var(--fa);text-transform:uppercase;letter-spacing:.12em}
.kv b{display:block;font:600 12.5px var(--mono);word-break:break-all;margin-top:1px}
.rawl{margin-top:8px;font:500 11px/1.5 var(--mono);color:var(--mu);word-break:break-all;background:rgba(0,0,0,.18);border:1px solid var(--ln);border-radius:12px;padding:8px 11px;max-height:4.6em;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--mu);font-weight:600;border:1.5px dashed var(--ln2);border-radius:22px}

/* modal, toast, fab */
.ov{position:fixed;inset:0;background:rgba(3,4,12,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:80;padding:18px}
.ov.on{display:grid;animation:fadei .2s both}
@keyframes fadei{from{opacity:0}}
.modal{width:min(380px,100%);background:var(--bg2);border:1px solid var(--ln2);border-radius:30px;padding:24px;text-align:center;box-shadow:var(--glow),0 30px 80px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.modal h3{font-size:16px;font-weight:720;display:flex;gap:10px;align-items:center;justify-content:center}
.pdot2{width:11px;height:11px;border-radius:50%;display:inline-block}
.modal p{font:500 11.5px/1.5 var(--mono);color:var(--mu);margin:8px 0 14px;word-break:break-all;max-height:3.4em;overflow:hidden}
.qrbox{background:#fff;border-radius:22px;padding:14px;display:inline-block}
.qrbox canvas{display:block;width:250px;height:250px;max-width:100%;image-rendering:pixelated}
.row2{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;transition:.3s cubic-bezier(.3,1.4,.4,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast::before{content:"✓ ";font-weight:900}
@media (min-width:1001px){.toast{bottom:26px}}
.fab{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;gap:6px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--bg2) 82%,transparent);border:1px solid var(--ln2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.fab button{height:46px;padding:0 18px;border-radius:99px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.2s;color:var(--tx)}
.fab button.p{background:var(--grad);color:#fff}
.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.fab button.ok svg{display:none}.fab button.ok::before{content:"✓";font-weight:800}

  .huds{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
  .hud,.hud:nth-child(n){position:static;max-width:none;min-width:0;text-align:left}
  .hud:nth-child(2),.hud:nth-child(4){text-align:left}
}
@media (max-width:1000px){
  .two{grid-template-columns:minmax(0,1fr)}
  .fab{display:flex}
  .app{padding-bottom:110px}
  .detail .pad{padding-left:14px}
}

  .app{padding:calc(8px + env(safe-area-inset-top)) 14px 110px}
  .brand small{display:none}
  .orbits{width:100%}

  .nb.on .nl{display:block;font-size:11px}
  .hud{padding:12px 14px;border-radius:18px}
  .hv{font-size:19px}.hv.mono{font-size:17px}

  .qrw{display:none}
  .toolbar{gap:8px}
  .search{flex-basis:100%;height:50px}.search kbd{display:none}.search input{font-size:16px}
  .seg{flex:1;min-width:0}
  .crow{flex-direction:column;align-items:stretch;gap:5px}

  .cw{flex-wrap:nowrap;max-width:100%}

    if(S.g==='proto') head='<span class="pdot" style="background:'+P[g.pk][1]+'"></span><div class="gt"><b>'+P[g.pk][0]+'</b><small>'+g.items.length+' '+plural(g.items.length,['вариант','варианта','вариантов'])+'</small></div>';
    else if(S.g==='country'){ var hs2={}; g.items.forEach(function(i){hs2[i.host]=1;}); var hl=Object.keys(hs2);
      head=flagC(g.cc)+'<div class="gt"><b>'+esc(ccName(g.cc))+'</b><small>'+esc(hl.slice(0,2).join(' · ')+(hl.length>2?' +'+(hl.length-2):''))+'</small></div>'+dots; }
    else head=flagC(g.cc)+'<div class="gt"><b>'+esc(ccName(g.cc))+'</b><small>'+esc(g.host||'—')+'</small></div>'+dots;
    return '<div class="gc'+(closed?' closed':'')+an+'"><div class="gh" role="button" tabindex="0" data-k="'+esc(key)+'">'+head+'<span class="cnt">'+g.items.length+'</span>'+
      '<button class="cbtn" data-nc="'+esc(key)+'" title="Скопировать все ссылки" aria-label="Скопировать все ссылки">'+ic(I.copy)+'</button>'+ic(I.chev).replace('<svg','<svg class="chev"')+'</div>'+
      '<div class="rowsw"><div class="rows">'+g.items.map(function(it){return rowHtml(it,S.g==='proto');}).join('')+'</div></div></div>';
  }).join('');
}
function syncToggle(){
  var keys=lastGs.map(function(g){return S.g+':'+g.key;}), all=keys.length&&keys.every(function(k){return S.closed[k];});
  $('toggleall').title=all?'Развернуть все':'Свернуть все';
}
function bindGroups(){
  $('groups').onclick=function(e){
    var b=e.target.closest('button');
    if(b&&b.dataset.nc!==undefined){ var g=lastGs.filter(function(x){return S.g+':'+x.key===b.dataset.nc;})[0]; if(g) copy(g.items.map(function(x){return x.raw;}).join('\n'),b); return; }
    if(b&&b.dataset.c!==undefined){ copy(items[b.dataset.c].raw,b); return; }
    if(b&&b.dataset.q!==undefined){ var it=items[b.dataset.q]; openQR(it.raw,it.proto+' · '+it.name,it.pc); return; }
    var t=e.target.closest('[data-tog]');
    if(t){ var i=t.dataset.tog; S.open[i]=!S.open[i]; t.closest('.row').classList.toggle('open'); return; }
    var h=e.target.closest('.gh');
    if(h){ var k=h.dataset.k; S.closed[k]=!S.closed[k]; h.parentNode.classList.toggle('closed'); syncToggle(); }
  };
  $('groups').onkeydown=function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gh')){ e.preventDefault(); e.target.click(); } };
  $('chips').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.pf!==undefined) S.pf=b.dataset.pf; if(b.dataset.tf!==undefined) S.tf=b.dataset.tf; renderChips(); renderGroups(false); };
  $('seg').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; S.g=b.dataset.g;
    [].forEach.call($('seg').querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);}); renderGroups(true); };
  $('q').oninput=function(){ S.q=this.value; renderGroups(false); };
  $('copyall').onclick=function(){ var l=visible(); if(!l.length) return; copy(l.map(function(x){return x.raw;}).join('\n'),this); };
  $('toggleall').onclick=function(){
    var keys=lastGs.map(function(g){return S.g+':'+g.key;}), all=keys.every(function(k){return S.closed[k];});
    keys.forEach(function(k){S.closed[k]=!all;});
    [].forEach.call($('groups').querySelectorAll('.gc'),function(n){ n.classList.toggle('closed',!all); }); syncToggle();
  };
}
var qrText='';
function makeQR(text){
  var bin=unescape(encodeURIComponent(text)), t, q;
  for(t=1;t<=40;t++){ try{ q=new __qr(t,1); q.addData(bin); q.make(); return q; }catch(e){} }
  return null;
}
function openQR(text,title,color){
  qrText=text; $('mt').innerHTML='<span class="pdot" style="background:'+(color||'#b3261e')+'"></span>'+esc(title); $('ml').textContent=text.length>120?text.slice(0,117)+'…':text;
  drawQR($('qr'),text); $('ov').classList.add('on');
}
function closeQR(){ $('ov').classList.remove('on'); }
$('mclose').onclick=closeQR; $('ov').onclick=function(e){ if(e.target===this) closeQR(); };
$('mcopy').onclick=function(){ copy(qrText,this); };
$('mdl').onclick=function(){ var a=document.createElement('a'); a.download='qr.png'; a.href=$('qr').toDataURL('image/png'); document.body.appendChild(a); a.click(); document.body.removeChild(a); };
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeQR(); if(e.target===$('q')){ $('q').value=''; S.q=''; renderGroups(false); $('q').blur(); } return; }
  var tg=(e.target.tagName||'').toLowerCase();
  if(e.key==='/'&&tg!=='input'&&tg!=='textarea'){ e.preventDefault(); $('q').focus(); }
});
/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

function head(){
  var t=str(D.subTitle)||'Подписка'; $('title').textContent=t; document.title=t;
  var id=str(D.sId); $('subid').textContent=id?'ID '+(id.length>20?id.slice(0,8)+'…'+id.slice(-4):id):'';
  var su=str(D.subSupportUrl); if(su&&/^(https?:|tg:|mailto:)/i.test(su)){ var a=$('support'); a.href=su; a.hidden=false; }
  var an=str(D.announce).trim(); if(an) $('announce').innerHTML='<div class="announce">'+esc(an).replace(/\n/g,'<br>')+'</div>';
}
S.node='';
head(); loadItems(); buildNodes(); renderNodes(); renderStage(true); renderUrls(); renderChips(); renderGroups(true); bindGroups(); bindStage();
$('fcopy').onclick=function(){ if(URLROWS.length) copy(URLROWS[0][2],this); else toast('Адрес подписки недоступен'); };
$('fqr').onclick=function(){ if(URLROWS.length) openQR(URLROWS[0][2],'QR · '+URLROWS[0][0],'#8b6cff'); else toast('Адрес подписки недоступен'); };
$('fapp').onclick=function(){ $('apps').scrollIntoView({behavior:'smooth',block:'center'}); };
/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
</script>
