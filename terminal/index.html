<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Подписка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306100b'/%3E%3Cpath d='M8 11l7 5-7 5M17 22h8' fill='none' stroke='%234dff9b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#040a07; --pn:#0a1711; --pn2:#0e1f17; --ln:#1c3629; --tx:#cdeadb; --dm:#6d9380; --fa:#3e5e4d;
  --ac:#4dff9b; --ac2:#5ce1ff; --am:#ffb454; --rd:#ff5f6d; --ink:#04120b;
  --glow:0 0 12px color-mix(in srgb,var(--ac) 45%,transparent);
  --mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#e3ebdd; --pn:#f6faf0; --pn2:#ecf3e4; --ln:#b9cdb4; --tx:#12261a; --dm:#55735f; --fa:#93ab9b;
  --ac:#0b7a43; --ac2:#0a6c8a; --am:#a85f00; --rd:#c4283a; --ink:#f6faf0;
  --glow:none; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.6 var(--mono);color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden;
  background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,transparent 0,var(--bg) 72%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--ac);color:var(--ink)}
.crt{position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.16) 3px);opacity:.5;mix-blend-mode:multiply}
.crt::after{content:"";position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(transparent,color-mix(in srgb,var(--ac) 7%,transparent),transparent);animation:scan 7s linear infinite}
html[data-theme="light"] .crt{opacity:.12}
html[data-theme="light"] .crt::after{display:none}
@keyframes scan{to{transform:translateY(calc(100vh + 280px))}}

.win{max-width:1120px;margin:22px auto;border:1px solid var(--ln);border-radius:14px;background:color-mix(in srgb,var(--pn) 94%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 8%,transparent),0 30px 80px rgba(0,0,0,.45),var(--glow);overflow:hidden;animation:flick .8s both}
@keyframes flick{0%{opacity:0}10%{opacity:.8}14%{opacity:.2}22%{opacity:.9}30%{opacity:.5}100%{opacity:1}}
.wbar{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--ln);background:var(--pn2)}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--fa);display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.wt{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt b{color:var(--tx);font-weight:700}
.wt em{font-style:normal;color:var(--fa);margin-left:10px}
.wr{display:flex;gap:8px;flex:none}
.tbtn{height:28px;padding:0 11px;border:1px solid var(--ln);border-radius:6px;font-size:12px;color:var(--dm);display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tbtn:hover{color:var(--ink);background:var(--ac);border-color:var(--ac)}
html[data-theme="dark"] .t-sun,html[data-theme="light"] .t-moon{display:none}
.screen{padding:22px 22px 26px}

.announce{border:1px dashed var(--am);color:var(--am);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.announce::before{content:"[warn] ";font-weight:800}

.boot{margin-bottom:20px;font-size:13.5px;min-height:3.4em}
.ps{color:var(--ac);font-weight:700;text-shadow:var(--glow)}
.pc{color:var(--dm)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--ac);vertical-align:text-bottom;margin-left:2px;animation:blink 1.05s steps(1) infinite;box-shadow:var(--glow)}
@keyframes blink{50%{opacity:0}}
.bl{color:var(--dm)}
.bl b{color:var(--ac);font-weight:700}

fieldset.pane{border:1px solid var(--ln);border-radius:10px;padding:18px 20px 18px;margin:0 0 18px;min-width:0;background:color-mix(in srgb,var(--pn2) 55%,transparent);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
fieldset.pane>legend{padding:0 10px;margin-left:8px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);text-shadow:var(--glow)}
fieldset.pane>legend::before{content:"[ "}
fieldset.pane>legend::after{content:" ]"}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.duo{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.duo fieldset.pane{margin:0}
.duo fieldset.pane:nth-child(2){animation-delay:.12s}
#subpane{animation-delay:.2s}
#nodes{animation-delay:.3s}

.bigtxt{font-size:clamp(54px,9vw,96px);font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--tx);text-shadow:var(--glow);font-variant-numeric:tabular-nums}
.bigtxt small{font-size:.3em;color:var(--dm);margin-left:.25em;letter-spacing:0;text-shadow:none;font-weight:600}
.of{color:var(--dm);margin:8px 0 14px}
.of b{color:var(--tx)}
.asc{display:flex;align-items:baseline;gap:8px;font-size:clamp(12px,1.7vw,19px);letter-spacing:0;white-space:nowrap;overflow:hidden;line-height:1.2}
.asc .br{color:var(--fa)}
.asc #bar{flex:none}
.asc .d{color:var(--ac);text-shadow:var(--glow)}
.asc .u{color:var(--ac2)}
.asc .f{color:var(--fa)}
.asc.warn .d{color:var(--am)}
.asc.bad .d{color:var(--rd)}
.asc.inf .f{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{color:var(--ac)}}
.asc .pc2{margin-left:auto;font-weight:800;color:var(--tx)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--dm);font-size:12px}
.legend .d{color:var(--ac)}.legend .u{color:var(--ac2)}
.kv{display:flex;align-items:baseline;gap:0;padding:3px 0;min-width:0}
.kv span{color:var(--dm);flex:none}
.kv i{flex:1;min-width:14px;border-bottom:1px dotted var(--fa);margin:0 8px;transform:translateY(-4px)}
.kv b{font-weight:700;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{margin-top:16px;border-top:1px dashed var(--ln);padding-top:12px}
.stat{font-size:clamp(22px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.stat .dot{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.stat.ok{color:var(--ac);text-shadow:var(--glow)}
.stat.warn{color:var(--am)}
.stat.bad{color:var(--rd)}
#cd{color:var(--ac2)}
.cdw{color:var(--am)}
.cdb{color:var(--rd)}
.chips-em{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips-em span{border:1px solid var(--ln);border-radius:4px;padding:1px 8px;color:var(--dm);font-size:12px}

/* subscription */
.sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:3px 12px;border:1px solid var(--ln);border-radius:5px;color:var(--dm);font-size:12.5px;transition:.15s}
.tabs button::before{content:"[ "}.tabs button::after{content:" ]"}
.tabs button:hover{color:var(--tx);border-color:var(--dm)}
.tabs button.on{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:800}
.code{display:flex;gap:14px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;font-size:14px;word-break:break-all;line-height:1.55;position:relative}
.code .ln{color:var(--fa);user-select:none;flex:none}
.code #urlbox{flex:1;min-width:0;color:var(--ac2)}
.code.flash{animation:flashc .5s}
@keyframes flashc{from{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--bg))}}
.cta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:36px;padding:0 15px;border:1px solid var(--ln);border-radius:6px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri{background:var(--ac);color:var(--ink);border-color:var(--ac);box-shadow:var(--glow)}
.btn.pri:hover{background:var(--tx);border-color:var(--tx);color:var(--bg);box-shadow:none}
.btn.ok::before{content:"✓"}
.btn.ok span{display:none}
.btn.sm{height:30px;padding:0 11px;font-size:12px}
.qrf{background:#fff;border-radius:8px;padding:10px;width:164px;height:164px;border:1px solid var(--ln);position:relative}
.qrf::after{content:"";position:absolute;inset:-5px;border:1px dashed var(--fa);border-radius:12px;pointer-events:none}
.qrf canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.apps{grid-column:1/-1;margin-top:16px;padding-top:14px;border-top:1px dashed var(--ln)}
.apps .al{color:var(--dm);margin-bottom:10px;font-size:12.5px}
.apps .al::before{content:"# ";color:var(--ac)}
.apps .grid{display:flex;flex-wrap:wrap;gap:8px}
.apps a{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--ln);border-radius:8px;font-size:13px;font-weight:700;transition:.15s}
.apps a:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);transform:translateY(-2px)}
.ai{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.ai svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* nodes */
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:16px}
.cmd{display:flex;align-items:center;gap:8px;flex:1 1 260px;border:1px solid var(--ln);border-radius:6px;padding:0 12px;height:38px;background:var(--bg);transition:.15s}
.cmd:focus-within{border-color:var(--ac);box-shadow:var(--glow)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;caret-color:var(--ac)}
.cmd input::placeholder{color:var(--fa)}
.cmd kbd{font:inherit;font-size:11px;color:var(--dm);border:1px solid var(--ln);border-radius:4px;padding:0 6px}
.cmd:focus-within kbd{display:none}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg .sl,.cl{color:var(--dm);font-size:12.5px}
.seg button{padding:2px 10px;border-radius:5px;border:1px solid transparent;color:var(--dm);transition:.15s}
.seg button:hover{color:var(--tx);border-color:var(--ln)}
.seg button.on{background:var(--ac);color:var(--ink);font-weight:800}
.acts{display:flex;gap:8px;margin-left:auto}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding-bottom:14px;border-bottom:1px dashed var(--ln)}
.crow{display:flex;align-items:baseline;gap:12px}
.cl{width:92px;flex:none}
.cw{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:2px 10px;border:1px solid var(--ln);border-radius:5px;color:var(--dm);font-size:12.5px;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.fchip::before{content:"○";color:var(--fa)}
.fchip:hover{color:var(--tx);border-color:var(--dm)}
.fchip.on{color:var(--tx);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.fchip.on::before{content:"●";color:var(--ac)}
.fchip.dim{opacity:.35}
.fchip i{width:8px;height:8px;border-radius:2px;display:block}
.fchip em{font-style:normal;color:var(--fa)}
#invsum{color:var(--dm);font-size:12.5px;margin:-6px 0 12px}
#invsum::before{content:"$ ";color:var(--ac)}

.grp{margin-bottom:14px}
.grp.an{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.gh{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:9px 10px;cursor:pointer;user-select:none;
  background:var(--pn2);border:1px solid var(--ln);border-radius:7px}
.gh:hover{border-color:var(--ac)}
.gh:focus-visible{outline:1px solid var(--ac)}
.car{color:var(--ac);transition:transform .25s;display:inline-block;width:12px}
.grp.closed .car{transform:rotate(-90deg)}
.gh .flag{width:28px;height:19px;border-radius:3px;display:block;flex:none}
.gh .flag-e{width:28px;height:19px;font-size:16px;display:grid;place-items:center;flex:none}
.gh b{font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.gh .hx{color:var(--dm);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .ld{flex:1;min-width:10px;border-bottom:1px dashed var(--fa);transform:translateY(-3px)}
.pdots{display:flex;gap:4px}
.pdots i{width:8px;height:8px;border-radius:2px;display:block}
.cnt{color:var(--ac);font-weight:800}
.cnt::before{content:"["}.cnt::after{content:"]"}
.pdot{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.rowsw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.3,.8,.2,1)}
.rowsw>.rows{overflow:hidden;min-height:0}
.grp.closed .rowsw{grid-template-rows:0fr}
.rows{padding-left:12px;margin-left:5px;border-left:1px dashed var(--fa)}
.row{position:relative}
.row::before{content:"";position:absolute;left:-12px;top:21px;width:10px;border-top:1px dashed var(--fa)}
.rm{display:grid;grid-template-columns:112px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:7px 8px;border-radius:6px;position:relative;transition:background .15s}
.rm:hover{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.rm::before{content:"▌";position:absolute;left:-3px;color:var(--pc);opacity:0;transition:opacity .15s}
.rm:hover::before,.row.open .rm::before{opacity:1}
.pk{border:1px solid var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,transparent);border-radius:4px;text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 0;white-space:nowrap;cursor:pointer}
.nm{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}
.nm b{font-weight:700;color:var(--tx);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:8px;flex:none}
.tag{font-size:12px;color:var(--dm)}
.tag::before{content:"‹"}.tag::after{content:"›"}
.tag.sec-reality{color:var(--ac)}
.tag.sec-tls{color:var(--ac2)}
.tag.sec-none{color:var(--am)}
.port{color:var(--ac2);font-weight:700;text-align:right;white-space:nowrap}
.ab{display:flex;gap:6px}
.ib{min-width:34px;height:26px;padding:0 8px;border:1px solid var(--ln);border-radius:5px;font-size:12px;color:var(--dm);transition:.15s}
.ib:hover{color:var(--ink);background:var(--ac);border-color:var(--ac)}
.ib.ok{color:var(--ink);background:var(--ac);border-color:var(--ac)}
.row.open .ib.tg{color:var(--ac);border-color:var(--ac)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.3,.8,.2,1)}
.row.open .detail{grid-template-rows:1fr}
.detail .in{overflow:hidden;min-height:0}
.detail .pad{padding:4px 8px 12px 126px}
.dk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 24px;font-size:12.5px}
.dk div{display:flex;gap:8px;min-width:0}
.dk span{color:var(--dm);flex:none;min-width:84px}
.dk b{font-weight:600;word-break:break-all;color:var(--tx)}
.rawl{margin-top:8px;font-size:11.5px;color:var(--fa);word-break:break-all;border:1px dashed var(--ln);border-radius:6px;padding:8px 10px;max-height:4.8em;overflow:hidden}
.empty{padding:40px 20px;text-align:center;color:var(--dm);border:1px dashed var(--ln);border-radius:8px}
.empty::before{content:"> ";color:var(--ac)}
.foot{color:var(--dm);font-size:12.5px;margin-top:6px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(2,6,4,.8);display:none;place-items:center;z-index:120;padding:18px}
.ov.on{display:grid;animation:fadei .15s both}
@keyframes fadei{from{opacity:0}}
.modal{width:min(400px,100%);background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:20px;text-align:center;box-shadow:var(--glow),0 20px 60px rgba(0,0,0,.6);animation:popi .25s cubic-bezier(.2,1.2,.3,1) both}
@keyframes popi{from{opacity:0;transform:scale(.94) translateY(8px)}}
.modal h3{font-size:14px;font-weight:800;display:flex;gap:9px;align-items:center;justify-content:center;color:var(--ac)}
.modal p{font-size:11.5px;color:var(--dm);margin:8px 0 14px;word-break:break-all;max-height:3.4em;overflow:hidden}
.qrbox{background:#fff;border-radius:8px;padding:14px;display:inline-block}
.qrbox canvas{display:block;width:250px;height:250px;max-width:100%;image-rendering:pixelated}
.row2{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:130;background:var(--ac);color:var(--ink);padding:9px 16px;border-radius:6px;font-weight:800;font-size:13px;transition:.25s cubic-bezier(.3,1.4,.4,1);box-shadow:var(--glow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast::before{content:"✓ "}

@media (max-width:900px){
  .duo{grid-template-columns:1fr}
  .sub{grid-template-columns:minmax(0,1fr)}
  .qrf{display:none}
  .acts{margin-left:0}
  .detail .pad{padding-left:8px}
  .nm{flex-wrap:wrap;gap:2px 12px}
  .tags{flex-wrap:wrap}
}
@media (max-width:640px){
  body{font-size:13.5px}
  .win{margin:0;border-radius:0;border-left:0;border-right:0;min-height:100vh}
  .wbar{padding:10px 12px;gap:10px}
  .dots{display:none}
  .wt{text-align:left}
  .wt em{display:none}
  .screen{padding:16px 12px calc(30px + env(safe-area-inset-bottom))}
  fieldset.pane{padding:14px 13px 14px}
  .boot{min-height:3em}
  .tbtn{height:34px}
  .btn{height:42px}
  .cta .btn{flex:1;justify-content:center}
  .code{font-size:12.5px;padding:12px}
  .cmd{height:44px}
  .cmd input{font-size:16px}
  .cmd kbd{display:none}
  .seg{overflow-x:auto;flex-wrap:nowrap;margin:0 -12px;padding:2px 12px;scrollbar-width:none}
  .seg::-webkit-scrollbar,.cw::-webkit-scrollbar{display:none}
  .seg button{flex:none;border-color:var(--ln);padding:6px 12px}
  .crow{flex-direction:column;gap:6px}
  .cw{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:2px 12px;scrollbar-width:none}
  .fchip{flex:none;padding:6px 12px}
  .acts{width:100%}
  .acts .btn{flex:1;justify-content:center;height:40px}
  .gh{padding:11px 10px;gap:9px}
  .gh .hx,.pdots{display:none}
  .rows{padding-left:8px;margin-left:3px}
  .row::before{left:-8px;top:18px;width:6px}
  .rm{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"b n p" "t t a";gap:6px 10px;padding:9px 4px}
  .rm .pk{grid-area:b;min-width:92px}
  .rm .nm{display:contents}
  .nm b{grid-area:n;white-space:normal;overflow:visible;word-break:break-word}
  .rm .tags{grid-area:t}
  .rm .port{grid-area:p}
  .rm .ab{grid-area:a;gap:6px}
  .ib{height:34px;min-width:44px}
  .ib.tg{display:none}
  .dk{grid-template-columns:1fr}
  .apps a{flex:1 1 calc(50% - 8px)}
  .asc{font-size:clamp(12px,3.9vw,16px)}
}

  selectTab(Math.min(SUBTAB,URLROWS.length-1),false);
  var u=str(D.subUrl); if(!u){ $('apps').style.display='none'; return; }
  var e=encodeURIComponent(u), c=encodeURIComponent(str(D.subClashUrl)||u), t=encodeURIComponent(str(D.subTitle)||'Подписка');
  var AI={
    happ:['#8b5cf6','#5b4be0','<path d="M7.5 5.5v13M16.5 5.5v13M7.5 12h9" stroke-width="2.8"/>'],
    incy:['#34d399','#059669','<circle cx="12" cy="12" r="8.2"/><path d="M12 11.2v5"/><circle cx="12" cy="7.9" r=".7" fill="#fff"/>'],
    hiddify:['#60a5fa','#2563eb','<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.5" fill="#fff" stroke="none"/>'],
    v2rayng:['#38bdf8','#0284c7','<path d="M5 6.5l7 12.5 7-12.5"/><path d="M12 3v3.2"/>'],
    streisand:['#fb923c','#ea580c','<path d="M12 3c.8 4.6 2.4 7.2 9 9-6.6 1.8-8.2 4.4-9 9-.8-4.6-2.4-7.2-9-9 6.6-1.8 8.2-4.4 9-9z" fill="#fff" stroke="none"/>'],
    v2box:['#2dd4bf','#0d9488','<path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.3 8-4.3M12 11.5V21"/>'],
    clash:['#f472b6','#db2777','<path d="M13.5 3L6 13.5h5L10 21l8-11h-5.2z" fill="#fff" stroke="none"/>'],
    singbox:['#94a3b8','#475569','<path d="M3.5 12H6l2-5.5 3 11 3-8 1.8 2.5h3.2"/>']
  };
  var apps=[['Happ','happ','happ://add/'+u],['INCY','incy','incy://import/'+u],['Hiddify','hiddify','hiddify://import/'+u+'#'+t],['v2rayNG','v2rayng','v2rayng://install-sub?url='+e+'&name='+t],
    ['Streisand','streisand','streisand://import/'+u],['V2Box','v2box','v2box://install-sub?url='+e+'&name='+t],['Clash','clash','clash://install-config?url='+c],['sing-box','singbox','sing-box://import-remote-profile?url='+e+'#'+t]];
  $('apps').innerHTML='<div class="al">импорт в приложение</div><div class="grid">'+apps.map(function(a){var k=AI[a[1]];
    return '<a href="'+esc(a[2])+'"><span class="ai" style="background:linear-gradient(135deg,'+k[0]+','+k[1]+')"><svg viewBox="0 0 24 24">'+k[2]+'</svg></span>'+a[0]+'</a>';}).join('')+'</div>';
}
function rowHtml(it,showCC){
  var tags=['<span class="tag">'+esc(it.proto.toLowerCase())+'</span>','<span class="tag sec-'+esc(it.sec)+'">'+esc(secLabel(it.sec).toLowerCase())+'</span>'];
  if(it.net) tags.push('<span class="tag">'+esc(netLabel(it.net).toLowerCase())+'</span>');
  if(showCC&&it.cc) tags.push('<span class="tag">'+esc(ccName(it.cc).toLowerCase())+'</span>');
  var kv=[['адрес',it.host],['порт',it.port],['протокол',it.proto],['безопасность',secLabel(it.sec)],['транспорт',netLabel(it.net)],['sni',it.p.sni||it.p.host],['flow',it.p.flow],
    ['fingerprint',it.p.fp],['путь',it.p.path],['режим',it.p.mode],['serviceName',it.p.serviceName],['obfs',it.p.obfs],['alpn',it.p.alpn]].filter(function(x){return str(x[1]);});
  return '<div class="row'+(S.open[it.idx]?' open':'')+'" data-i="'+it.idx+'"><div class="rm" style="--pc:'+it.pc+'"><div class="pk" data-tog="'+it.idx+'">'+esc(it.proto)+'</div>'+
    '<div class="nm" data-tog="'+it.idx+'"><b title="'+esc(it.remark||it.name)+'">'+esc(it.name)+'</b><div class="tags">'+tags.join('')+'</div></div>'+
    '<div class="port">'+(it.port?':'+esc(it.port):'')+'</div>'+
    '<div class="ab"><button class="ib" data-c="'+it.idx+'" title="Копировать ссылку" aria-label="Копировать ссылку">cp</button>'+
    '<button class="ib" data-q="'+it.idx+'" title="QR-код" aria-label="QR-код">qr</button>'+
    '<button class="ib tg" data-tog="'+it.idx+'" title="Подробнее" aria-label="Подробнее">···</button></div></div>'+
    '<div class="detail"><div class="in"><div class="pad"><div class="dk">'+kv.map(function(x){return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';}).join('')+'</div>'+
    '<div class="rawl">'+esc(it.raw)+'</div></div></div></div></div>';
}
function renderChips(){
  var pc={}, nc={}, np=0, nn=0, allP={}, allN={};
  items.forEach(function(it){
    allP[it.pk]=1; allN[netKey(it)||'other']=1;
    if(S.tf==='all'||netKey(it)===S.tf){ pc[it.pk]=(pc[it.pk]||0)+1; np++; }
    if(S.pf==='all'||it.pk===S.pf){ var k=netKey(it)||'other'; nc[k]=(nc[k]||0)+1; nn++; }
  });
  var pk=Object.keys(allP).sort(function(a,b){return P[a][2]-P[b][2];});
  var nk=Object.keys(allN).sort(function(a,b){return (NETRANK[a]===undefined?99:NETRANK[a])-(NETRANK[b]===undefined?99:NETRANK[b]);});
  if(S.tf!=='all'&&!allN[S.tf]) S.tf='all';
  var h='';
  if(pk.length>1){
    h+='<div class="crow"><span class="cl">протокол:</span><div class="cw"><button class="fchip'+(S.pf==='all'?' on':'')+'" data-pf="all">все <em>'+np+'</em></button>';
    pk.forEach(function(k){ h+='<button class="fchip'+(S.pf===k?' on':'')+(pc[k]?'':' dim')+'" data-pf="'+k+'"><i style="background:'+P[k][1]+'"></i>'+P[k][0].toLowerCase()+' <em>'+(pc[k]||0)+'</em></button>'; });
    h+='</div></div>';
  }
  if(nk.length>1){
    h+='<div class="crow"><span class="cl">транспорт:</span><div class="cw"><button class="fchip'+(S.tf==='all'?' on':'')+'" data-tf="all">все <em>'+nn+'</em></button>';
    nk.forEach(function(k){ h+='<button class="fchip'+(S.tf===k?' on':'')+(nc[k]?'':' dim')+'" data-tf="'+k+'">'+esc(k==='other'?'другое':netLabel(k).toLowerCase())+' <em>'+(nc[k]||0)+'</em></button>'; });
    h+='</div></div>';
  }
  $('chips').innerHTML=h; $('chips').style.display=h?'':'none';
}
var lastGs=[];
function renderGroups(anim){
  var list=visible(), gs=groups(list), hosts={};
  lastGs=gs;
  items.forEach(function(it){hosts[it.host]=1;});
  var nh=Object.keys(hosts).length;
  $('invsum').textContent='ls --nodes · '+items.length+' '+plural(items.length,['подключение','подключения','подключений'])+' · '+nh+' '+plural(nh,['узел','узла','узлов'])+(list.length!==items.length?' · показано '+list.length:'');
  $('toggleall').style.display=S.g==='list'?'none':'';
  syncToggle();
  if(!list.length){ $('groups').innerHTML='<div class="empty">'+(items.length?'ничего не найдено':'в подписке пока нет подключений')+'</div>'; return; }
  var n=0;
  $('groups').innerHTML=gs.map(function(g){
    var an=anim?' an" style="animation-delay:'+(Math.min(n++,10)*60)+'ms':'';
    if(S.g==='list') return '<div class="grp'+an+'"><div class="rowsw"><div class="rows" style="border:0;margin:0;padding:0">'+g.items.map(function(it){return rowHtml(it,true);}).join('')+'</div></div></div>';
    var key=S.g+':'+g.key, closed=S.closed[key], pd={}, head;
    g.items.forEach(function(i){pd[i.pk]=1;});
    var dots='<span class="pdots">'+Object.keys(pd).sort(function(a,b){return P[a][2]-P[b][2];}).map(function(k){return '<i style="background:'+P[k][1]+'" title="'+P[k][0]+'"></i>';}).join('')+'</span>';
    if(S.g==='proto') head='<span class="pdot" style="background:'+P[g.pk][1]+'"></span><b>'+P[g.pk][0]+'</b><span class="hx">'+g.items.length+' '+plural(g.items.length,['вариант','варианта','вариантов'])+'</span>';
    else if(S.g==='country'){ var hs2={}; g.items.forEach(function(i){hs2[i.host]=1;}); var hl=Object.keys(hs2);
      head=flag(g.cc)+'<b>'+esc(ccName(g.cc))+'</b><span class="hx">'+esc(hl.slice(0,2).join(' · ')+(hl.length>2?' +'+(hl.length-2):''))+'</span>'; }
    else head=flag(g.cc)+'<b>'+esc(ccName(g.cc))+'</b><span class="hx">'+esc(g.host||'—')+'</span>';
    return '<div class="grp'+(closed?' closed':'')+an+'"><div class="gh" role="button" tabindex="0" data-k="'+esc(key)+'"><span class="car">▾</span>'+head+'<i class="ld"></i>'+(S.g==='proto'?'':dots)+'<span class="cnt">'+g.items.length+'</span>'+
      '<button class="ib" data-nc="'+esc(key)+'" title="Скопировать все ссылки" aria-label="Скопировать все ссылки">cp</button></div>'+
      '<div class="rowsw"><div class="rows">'+g.items.map(function(it){return rowHtml(it,S.g==='proto');}).join('')+'</div></div></div>';
  }).join('');
}
function syncToggle(){
  var keys=lastGs.map(function(g){return S.g+':'+g.key;}), all=keys.length&&keys.every(function(k){return S.closed[k];});
  $('toggleall').querySelector('span').textContent=all?'развернуть все':'свернуть все';
}
function bindGroups(){
  $('groups').onclick=function(e){
    var b=e.target.closest('button');
    if(b&&b.dataset.nc!==undefined){ var g=lastGs.filter(function(x){return S.g+':'+x.key===b.dataset.nc;})[0]; if(g) copy(g.items.map(function(x){return x.raw;}).join('\n'),b); return; }
    if(b&&b.dataset.c!==undefined){ copy(items[b.dataset.c].raw,b); return; }
    if(b&&b.dataset.q!==undefined){ var it=items[b.dataset.q]; openQR(it.raw,it.proto+' · '+it.name,it.pc); return; }
    var t=e.target.closest('[data-tog]');
    if(t){ var i=t.dataset.tog; S.open[i]=!S.open[i]; t.closest('.row').classList.toggle('open'); return; }
    var h=e.target.closest('.gh');
    if(h){ var k=h.dataset.k; S.closed[k]=!S.closed[k]; h.parentNode.classList.toggle('closed'); syncToggle(); }
  };
  $('groups').onkeydown=function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gh')){ e.preventDefault(); e.target.click(); } };
  $('chips').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.pf!==undefined) S.pf=b.dataset.pf; if(b.dataset.tf!==undefined) S.tf=b.dataset.tf; renderChips(); renderGroups(false); };
  $('seg').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; S.g=b.dataset.g;
    [].forEach.call($('seg').querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);}); renderGroups(true); };
  $('q').oninput=function(){ S.q=this.value; renderGroups(false); };
  $('copyall').onclick=function(){ var l=visible(); if(!l.length) return; copy(l.map(function(x){return x.raw;}).join('\n'),this); };
  $('toggleall').onclick=function(){
    var keys=lastGs.map(function(g){return S.g+':'+g.key;}), all=keys.every(function(k){return S.closed[k];});
    keys.forEach(function(k){S.closed[k]=!all;});
    [].forEach.call($('groups').querySelectorAll('.grp'),function(n){ n.classList.toggle('closed',!all); }); syncToggle();
  };
}
/* ----------------------------------------------------------------------------- QR */
var qrText='';
function makeQR(text){
  var bin=unescape(encodeURIComponent(text)), t, q;
  for(t=1;t<=40;t++){ try{ q=new __qr(t,1); q.addData(bin); q.make(); return q; }catch(e){} }
  return null;
}
function openQR(text,title,color){
  qrText=text; $('mt').innerHTML='<span class="pdot" style="background:'+(color||'#d2ff3d')+'"></span>'+esc(title); $('ml').textContent=text.length>120?text.slice(0,117)+'…':text;
  drawQR($('qr'),text); $('ov').classList.add('on');
}
function closeQR(){ $('ov').classList.remove('on'); }
$('mclose').onclick=closeQR;
$('ov').onclick=function(e){ if(e.target===this) closeQR(); };
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeQR();
  var tg=(e.target.tagName||'').toLowerCase();
  if(e.key==='/'&&tg!=='input'&&tg!=='textarea'){ e.preventDefault(); $('q').focus(); }
  else if(e.key==='Escape'&&e.target===$('q')){ $('q').value=''; S.q=''; renderGroups(false); $('q').blur(); }
});
$('mcopy').onclick=function(){ copy(qrText,this); };
$('mdl').onclick=function(){ var a=document.createElement('a'); a.download='qr.png'; a.href=$('qr').toDataURL('image/png'); document.body.appendChild(a); a.click(); document.body.removeChild(a); };

/* ---------------------------------------------------------------------------- тема */
(function(){
  var th='dark';
  try{ th=localStorage.getItem('sub-theme')||''; }catch(e){}
  if(th!=='dark'&&th!=='light') th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('theme').onclick=function(){
    th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('sub-theme',th); }catch(e){}
  };
})();

/* --------------------------------------------------------------------------- старт */
function head(){
  var t=str(D.subTitle)||'subscription'; $('title').textContent=t; document.title=t;
  var id=str(D.sId); $('subid').textContent=id?'id:'+(id.length>16?id.slice(0,8)+'…':id):'';
  var su=str(D.subSupportUrl); if(su&&/^(https?:|tg:|mailto:)/i.test(su)){ var a=$('support'); a.href=su; a.hidden=false; }
  var an=str(D.announce).trim(); if(an) $('announce').innerHTML='<div class="announce">'+esc(an).replace(/\n/g,'<br>')+'</div>';
  var em=(Array.isArray(D.emails)?D.emails:[]).map(str).filter(Boolean); if(em.length) $('who').textContent=em[0].split('@')[0].replace(/[^\w.\-]/g,'')+'@sub';
}
function bootType(){
  var hosts={}, protos={}; items.forEach(function(it){hosts[it.host]=1;protos[it.pk]=1;});
  var log='[ <b>ok</b> ] разобрано ссылок: '+items.length+' · узлов: '+Object.keys(hosts).length+' · протоколов: '+Object.keys(protos).length;
  var cmd='cat subscription.conf', el=$('typed');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=cmd; $('bl').innerHTML=log; return; }
  var i=0, iv=setInterval(function(){ el.textContent=cmd.slice(0,++i); if(i>=cmd.length){ clearInterval(iv); setTimeout(function(){ $('bl').innerHTML=log; },180); } },42);
}
head(); loadItems(); renderHero(true); renderUrls(); renderChips(); renderGroups(true); bindGroups(); bootType();
/* живое обновление трафика и статуса */
function refresh(){
  if(document.hidden) return;
  try{
    var u=new URL(location.href); u.searchParams.set('format','info');
    fetch(u.toString(),{headers:{'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object') return; var ch=false;
      ['enabled','download','upload','total','used','remained','expire','lastOnline','isOnline','downloadByte','uploadByte','totalByte'].forEach(function(k){
        if(j[k]!==undefined&&j[k]!==null&&j[k]!==D[k]){ D[k]=j[k]; ch=true; } });
      if(ch) renderHero();
    }).catch(function(){});
  }catch(e){}
}
setInterval(refresh,30000);
})();
